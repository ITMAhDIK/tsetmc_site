                className="flex-1 min-w-48 p-2.5 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)] text-xs" />
              <button disabled={busy} className="px-4 py-2 rounded bg-blue-600 text-white text-xs">تغییر رمز</button>
            </form>
          </details>
        </div>
      );
    }

    // --- 7. Staff and super-admin console ---
    function SiteAdminDashboardPage({ user }) {
      const [overview, setOverview] = useState(null);
      const [staff, setStaff] = useState([]);
      const [tickets, setTickets] = useState([]);
      const [username, setUsername] = useState('');
      const [displayName, setDisplayName] = useState('');
      const [temporaryPassword, setTemporaryPassword] = useState('');
      const [role, setRole] = useState('support');
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      const [notice, setNotice] = useState('');
      const isSuperAdmin = user && user.role === 'super_admin';

      const refresh = async () => {
        const results = await Promise.all([
          apiFetch('/api/v1/site-admin/overview'),
          apiFetch('/api/v1/site-admin/staff'),
          apiFetch('/api/v1/tickets'),
        ]);
        setOverview(results[0]);
        setStaff(results[1].staff || []);
        setTickets(results[2].tickets || []);
      };

      useEffect(() => {
        refresh().catch(e => setError(e.message));
      }, []);

      const createStaff = async (event) => {
        event.preventDefault();
        setBusy(true); setError(''); setNotice('');
        try {
          const result = await apiFetch('/api/v1/site-admin/staff', {
            method: 'POST',
            body: JSON.stringify({
              username, display_name: displayName || username,
              temporary_password: temporaryPassword, role,
            }),
          });
          setNotice('حساب ' + result.staff.username + ' ساخته شد. رمز موقت را به‌صورت امن به فرد تحویل دهید؛ تغییر آن در اولین ورود اجباری است.');
          setUsername(''); setDisplayName(''); setTemporaryPassword('');
          await refresh();
        } catch (e) { setError(e.message); }
        finally { setBusy(false); }
      };

      const changeRole = async (staffUser, nextRole) => {
        setError(''); setNotice('');
        try {
          await apiFetch('/api/v1/site-admin/staff/' + staffUser.id, {
            method: 'POST', body: JSON.stringify({ role: nextRole }),
          });
          setNotice('نقش کاربر به‌روزرسانی شد.');
          await refresh();
        } catch (e) { setError(e.message); }
      };

      const assignTicket = async (ticketId, assignedTo) => {
        try {
          await apiFetch('/api/v1/tickets/' + ticketId + '/assign', {
            method: 'POST', body: JSON.stringify({ assigned_to: assignedTo }),
          });
          await refresh();
        } catch (e) { setError(e.message); }
      };

      const updateTicketStatus = async (ticketId, status) => {
        try {
          await apiFetch('/api/v1/tickets/' + ticketId + '/status', {
            method: 'POST', body: JSON.stringify({ status }),
          });
          await refresh();
        } catch (e) { setError(e.message); }
      };

      return (
        <div className="space-y-4">
          <div>
            <div className="text-[11px] text-blue-400">{isSuperAdmin ? 'کنترل کامل سامانه' : 'مدیریت تیم'}</div>
            <h1 className="text-xl font-bold mt-1">{isSuperAdmin ? 'پنل سوپرادمین' : 'پنل مدیریت'}</h1>
            <p className="text-xs text-[var(--text-secondary)] mt-1">مدیریت کاربران، ادمین‌ها، نیروهای پشتیبانی و ارجاع تیکت‌ها.</p>
          </div>
          <ErrorBox error={error} />
          {notice && <div className="p-3 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-xs text-emerald-300">{notice}</div>}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
            {[
              ['کاربران', overview && overview.users],
              ['اشتراک‌های فعال', overview && overview.premium_users],
              ['تیکت‌های باز', overview && overview.open_tickets],
              ['پرداخت‌های موفق', overview && overview.paid_orders],
            ].map(([label,value]) => (
              <div key={label} className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] p-3">
                <div className="text-[11px] text-[var(--text-secondary)]">{label}</div>
                <div className="text-xl font-bold num mt-1">{fmtNum(value || 0)}</div>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-2 gap-3">
            <section className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] p-4">
              <div className="flex justify-between items-center gap-2">
                <h2 className="font-bold text-sm">ادمین‌ها و پشتیبان‌ها</h2>
                <span className="text-[10px] text-[var(--text-secondary)]">{fmtNum(staff.length)} نفر</span>
              </div>
              <div className="mt-3 space-y-2">
                {staff.map(person => (
                  <div key={person.id} className="flex flex-wrap items-center justify-between gap-2 rounded-lg bg-[var(--bg-elevated)] p-2.5">
                    <div>
                      <div className="font-semibold text-xs">{person.display_name || person.username}</div>
                      <div className="text-[10px] text-[var(--text-secondary)] num">{person.public_id} · {person.username}</div>
                    </div>
                    <select value={person.role} disabled={!isSuperAdmin || person.role === 'super_admin'}
                      onChange={e => changeRole(person, e.target.value)}
                      className="px-2 py-1.5 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] text-xs">
                      <option value="support">پشتیبان</option>
                      <option value="admin">ادمین</option>
                      <option value="member">کاربر عادی</option>
                      {person.role === 'super_admin' && <option value="super_admin">سوپرادمین</option>}
                    </select>
                  </div>
                ))}
              </div>
            </section>

            <section className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] p-4">
              <h2 className="font-bold text-sm">افزودن نیروی جدید</h2>
              {isSuperAdmin ? (
                <form onSubmit={createStaff} className="space-y-2.5 mt-3">
                  <label className="block text-xs">شناسه ورود
                    <input value={username} onChange={e => setUsername(e.target.value)} required minLength={4}
                      className="mt-1 w-full p-2.5 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)]" />
                  </label>
                  <label className="block text-xs">نام نمایشی
                    <input value={displayName} onChange={e => setDisplayName(e.target.value)}
                      className="mt-1 w-full p-2.5 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)]" />
                  </label>
                  <label className="block text-xs">رمز موقت (حداقل ۱۰ نویسه)
                    <input type="password" value={temporaryPassword} onChange={e => setTemporaryPassword(e.target.value)}
                      minLength={10} required
                      className="mt-1 w-full p-2.5 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)]" />
                  </label>
                  <label className="block text-xs">سطح دسترسی
                    <select value={role} onChange={e => setRole(e.target.value)}
                      className="mt-1 w-full p-2.5 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)]">
                      <option value="support">پشتیبان</option>
                      <option value="admin">ادمین</option>
                    </select>
                  </label>
                  <button disabled={busy} className="w-full py-2.5 rounded bg-blue-600 text-white text-xs disabled:opacity-50">
                    {busy ? 'در حال ساخت...' : 'ساخت حساب کارمند'}
                  </button>
                </form>
              ) : (
                <p className="text-xs text-[var(--text-secondary)] mt-3">ساخت ادمین یا پشتیبان فقط در اختیار سوپرادمین است.</p>
              )}
            </section>
          </div>

          <section className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] p-4">
            <div className="flex items-center justify-between gap-2 mb-3">
              <h2 className="font-bold text-sm">صف تیکت‌ها</h2>
              <span className="text-[10px] text-[var(--text-secondary)]">تخصیص بر اساس تیم پشتیبانی</span>
            </div>
            <div className="space-y-2">
              {tickets.length === 0 ? (
                <p className="text-xs text-[var(--text-secondary)]">تیکتی وجود ندارد.</p>
              ) : tickets.map(ticket => (
                <div key={ticket.id} className="grid grid-cols-1 lg:grid-cols-[1fr_180px_150px] gap-2 items-center rounded-lg border border-[var(--border-subtle)] p-2.5">
                  <div>
                    <div className="text-xs font-semibold">{ticket.subject}</div>
                    <div className="text-[10px] text-[var(--text-secondary)]">{ticket.customer_name || ''} · #{toFa(ticket.id)} · {ticket.status}</div>
                  </div>
                  <select value={ticket.assigned_to || ''} onChange={e => assignTicket(ticket.id, e.target.value)}
                    className="w-full p-2 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)] text-xs">
                    <option value="">بدون مسئول</option>
                    {staff.filter(person => person.role === 'support' || person.role === 'admin' || person.role === 'super_admin')
                      .map(person => <option key={person.id} value={person.id}>{person.display_name || person.username}</option>)}
                  </select>
                  <select value={ticket.status} onChange={e => updateTicketStatus(ticket.id, e.target.value)}
                    className="w-full p-2 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)] text-xs">
                    <option value="open">باز</option>
                    <option value="waiting_support">در انتظار پشتیبانی</option>
                    <option value="waiting_customer">در انتظار کاربر</option>
                    <option value="closed">بسته</option>
                  </select>
                </div>
              ))}
            </div>
          </section>
        </div>
      );
    }

    // --- 11. Page 8: Real Ingestion Administration Panel ---
    function AdminDashboardPage() {
      const [overview, setOverview] = useState(null);
      const [manifests, setManifests] = useState([]);
      const [errors, setErrors] = useState([]);
      const [queue, setQueue] = useState([]);
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [manifestQ, setManifestQ] = useState('');
      const [msg, setMsg] = useState('');

      const refreshAll = useCallback(() => {
        apiFetch('/api/v1/admin/overview').then(setOverview);
        apiFetch(`/api/v1/admin/manifests?status=${statusFilter}&q=${encodeURIComponent(manifestQ)}&limit=50`).then(r => setManifests(r.rows || []));
        apiFetch('/api/v1/admin/errors?limit=30').then(r => setErrors(r.errors || []));
        apiFetch('/api/v1/admin/identity/queue?limit=30').then(r => setQueue(r.queue || []));
      }, [statusFilter, manifestQ]);

      useEffect(() => { refreshAll(); }, [refreshAll]);

      const trigger = (retryFailed) => {
        apiFetch(`/api/v1/admin/ingestion/trigger?retry_failed=${retryFailed}`, { method: 'POST' })
          .then(res => { setMsg(`پایپلاین ایمپورت با PID ${res.pid} شروع شد.`); refreshAll(); })
          .catch(e => setMsg(e.message));
      };

      const resolveLink = (linkId, decision) => {
        apiFetch('/api/v1/admin/identity/resolve', {
          method: 'POST',
          body: JSON.stringify({ link_id: linkId, decision, reason: 'Manual review from Admin panel' }),
        }).then(() => refreshAll());
      };

      const mBySt = overview?.manifests_by_status || {};
      const tot = overview?.totals || {};
      const duck = overview?.sqlite_health || {};
      const run = overview?.latest_run;
      const doneInRun = run ? (run.processed_files + run.failed_files) : 0;
      const pctRun = run && run.total_files > 0 ? Math.min(100, Math.round((doneInRun / run.total_files) * 100)) : 0;

      return (
        <div className="space-y-3 text-xs">
          {msg && <div className="p-2 rounded bg-blue-500/15 text-blue-300">{msg}</div>}

          <div className="grid grid-cols-2 md:grid-cols-6 gap-2">
            {[
              ['فایل‌های کشف‌شده', fmtNum(tot.total_discovered_files ?? 0)],
              ['تکمیل‌شده (Completed)', fmtNum(mBySt.completed ?? 0)],
              ['ناموفق (Failed)', fmtNum(mBySt.failed ?? 0)],
              ['نمادهای یکتا (SQLite)', fmtNum(duck.unique_symbols ?? 0)],
              ['رکوردهای مالکیت', fmtNum(duck.holdings_records ?? 0)],
              ['وضعیت SQLite', duck.healthy ? 'آنلاین' : 'خطا'],
            ].map(([k, v]) => (
              <div key={k} className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)]">
                <div className="text-[var(--text-secondary)]">{k}</div>
                <div className="font-bold mt-1 num">{v}</div>
              </div>
            ))}
          </div>

          <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2">
            <div className="flex flex-wrap justify-between items-center gap-2">
              <div>
                آخرین ایمپورت موفق: <span className="num">{tot.last_successful_ingestion || '—'}</span> | وضعیت اجرا: <strong>{overview?.ingestion_subprocess_running ? 'در حال پردازش...' : 'آماده'}</strong>
              </div>
              <div className="flex gap-2">
                <button onClick={refreshAll} className="px-2.5 py-1 rounded border border-[var(--border-subtle)] bg-[var(--bg-elevated)]">به‌روزرسانی</button>
                <button onClick={() => trigger(false)} className="px-3 py-1 rounded bg-blue-600 text-white">شروع / ادامه ایمپورت</button>
                <button onClick={() => trigger(true)} className="px-3 py-1 rounded bg-amber-600 text-white">پردازش مجدد خطاها</button>
              </div>
            </div>
            {run && (
              <div className="space-y-1">
                <div className="flex justify-between text-[11px] text-[var(--text-secondary)]">
                  <span>پیشرفت آخرین اجرا ({run.status}): <span className="num">{fmtNum(doneInRun)} / {fmtNum(run.total_files)}</span> (رد شده بدون تغییر: <span className="num">{fmtNum(run.skipped_files)}</span>)</span>
                  <span className="num font-bold">{toFa(pctRun)}٪</span>
                </div>
                <div className="w-full h-2 rounded bg-[var(--bg-canvas)] overflow-hidden">
                  <div style={{ width: `${pctRun}%` }} className="h-full bg-blue-500 transition-all" />
                </div>
              </div>
            )}
          </div>

          <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2">
            <div className="flex flex-wrap justify-between items-center gap-2">
              <h2 className="font-bold">مانیفست فایل‌ها (`ingestion_manifests`)</h2>
              <div className="flex flex-wrap gap-1.5">
                <input value={manifestQ} onChange={e => setManifestQ(e.target.value)} placeholder="جستجوی فایل یا نماد..." className="px-2 py-0.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)]" />
                {['ALL', 'completed', 'pending', 'processing', 'failed'].map(st => (
                  <button key={st} onClick={() => setStatusFilter(st)} className={`px-2 py-0.5 rounded border border-[var(--border-subtle)] ${statusFilter === st ? 'bg-blue-600 text-white' : ''}`}>{st}</button>
                ))}
              </div>
            </div>
            <div className="overflow-x-auto max-h-60 overflow-y-auto">
              <table className="w-full text-right">
                <thead className="bg-[var(--bg-elevated)]"><tr><th className="p-2">فایل</th><th className="p-2">نماد</th><th className="p-2">رکوردهای مالکیت</th><th className="p-2">مرحله</th><th className="p-2">وضعیت</th><th className="p-2">خطا</th></tr></thead>
                <tbody className="divide-y divide-[var(--border-subtle)]">
                  {manifests.map(m => (
                    <tr key={m.file_path}><td className="p-2 num">{m.file_name}</td><td className="p-2 font-bold">{m.symbol || '—'}</td><td className="p-2 num">{fmtNum(m.holdings_rows)}</td><td className="p-2">{m.last_stage}</td><td className="p-2">{m.status}</td><td className="p-2 text-red-400">{m.last_error || '—'}</td></tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2">
              <h2 className="font-bold">صف تأیید هویت سهام‌داران ({toFa(queue.length)})</h2>
              <div className="max-h-60 overflow-y-auto space-y-1.5">
                {queue.map(qItem => (
                  <div key={qItem.id} className="p-2 rounded bg-[var(--bg-elevated)] flex justify-between items-center gap-2">
                    <div>
                      <div className="font-semibold">{qItem.observed_name}</div>
                      <div className="text-[10px] text-[var(--text-secondary)] num">{qItem.symbol} | {qItem.id_scheme}:{qItem.raw_source_id} ({qItem.link_status})</div>
                    </div>
                    <div className="flex gap-1">
                      <button onClick={() => resolveLink(qItem.id, 'verified')} className="px-2 py-0.5 rounded bg-emerald-600 text-white">تأیید</button>
                      <button onClick={() => resolveLink(qItem.id, 'conflicting')} className="px-2 py-0.5 rounded bg-red-600 text-white">تعارض</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2">
              <h2 className="font-bold">لاگ خطاهای ایمپورت ({toFa(errors.length)})</h2>
              <div className="max-h-60 overflow-y-auto space-y-1.5">
                {errors.map(er => (
                  <div key={er.id} className="p-2 rounded bg-[var(--bg-elevated)] border border-red-500/20">
                    <div className="font-semibold text-red-400">{er.file_name} {er.sheet_name ? `(${er.sheet_name})` : ''} {er.row_number ? `سطر ${toFa(er.row_number)}` : ''}</div>
                    <div className="text-[11px]">{er.error_message}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 12. Root Shell ---
    const NAV_PAGES = [
      { id: 'market', label: 'نمای کلی بازار' },
      { id: 'stock', label: 'تحلیل نماد' },
      { id: 'account', label: 'حساب و اشتراک' },
    ];

    function App() {
      const [page, setPage] = useState('market');
      const [activeSymbol, setActiveSymbol] = useState('');
      const [theme, setTheme] = useState('dark');
      const [currency, setCurrency] = useState('IRR');
      const [user, setUser] = useState(null);
      const [quickSearch, setQuickSearch] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [authLoading, setAuthLoading] = useState(true);

      useEffect(() => {
        setDateModeGlobal('jalali');
        apiFetch('/api/v1/auth/me')
          .then(result => {
            const current = result.user || null;
            setUser(current);
            window.__siteCsrf = current ? (current.csrf_token || '') : '';
          })
          .catch(() => {
            setUser(null);
            window.__siteCsrf = '';
          })
          .finally(() => setAuthLoading(false));
      }, []);

      useEffect(() => {
        apiFetch('/api/v1/market/watch?limit=1&sort_by=market_value')
          .then(res => {
            if (res.rows && res.rows.length > 0) {
              setActiveSymbol(previous => previous || res.rows[0].symbol);
            }
          })
          .catch(() => {});
      }, []);

      useEffect(() => {
        if (!quickSearch.trim()) { setSearchResults([]); return; }
        const timer = setTimeout(() => {
          apiFetch('/api/v1/stocks/search?q=' + encodeURIComponent(quickSearch.trim()))
            .then(res => setSearchResults(res.results || []))
            .catch(() => setSearchResults([]));
        }, 220);
        return () => clearTimeout(timer);
      }, [quickSearch]);

      useEffect(() => {
        if (page === 'admin' && (!user || user.role !== 'super_admin')) setPage('market');
        if (page === 'site-admin' && (!user || !['admin','super_admin'].includes(user.role))) setPage('market');
      }, [page, user]);

      const openStock = (symbol) => {
        setActiveSymbol(symbol);
        setPage('stock');
        setQuickSearch('');
        setSearchResults([]);
      };

      const availablePages = [
        ...NAV_PAGES,
        ...(user && user.is_premium
          ? [{ id: 'investor-affinity', label: 'تحلیل گرایش صنایع' }] : []),
        ...(user && ['admin','super_admin'].includes(user.role)
          ? [{ id: 'site-admin', label: 'مدیریت کاربران و پشتیبانی' }] : []),
        ...(user && user.role === 'super_admin'
          ? [{ id: 'admin', label: 'مدیریت زیرساخت' }] : []),
      ];

      const openAdmin = () => {
        if (user && ['admin','super_admin'].includes(user.role)) setPage('site-admin');
      };

      return (
        <div className={'app-shell min-h-screen flex flex-col text-[var(--text-primary)] ' +
          (theme === 'light' ? 'theme-light' : '')}>
          <header className="app-header">
            <div className="app-topbar-inner">
              <button onClick={() => setPage('market')} className="app-brand" aria-label="بازگشت به نمای کلی بازار">
                <span className="app-brand-mark" aria-hidden="true">ر</span>
                <span className="app-brand-copy">
                  <strong>ره‌نگار بورس</strong>
                  <small>تحلیل بازار و گروه‌های صنعتی</small>
                </span>
              </button>

              <div className="app-search" role="search">
                <span className="app-search-glyph" aria-hidden="true">⌕</span>
                <input value={quickSearch}
                  onChange={event => setQuickSearch(event.target.value)}
                  onKeyDown={event => {
                    if (event.key === 'Escape') { setQuickSearch(''); setSearchResults([]); }
                    if (event.key === 'Enter' && searchResults[0]) openStock(searchResults[0].symbol);
                  }}
                  placeholder="جستجوی نماد یا نام شرکت..."
                  aria-label="جستجوی نماد یا نام شرکت"
                  aria-expanded={searchResults.length > 0}
                  className="app-search-input" />
                {searchResults.length > 0 && (
                  <div className="app-search-results text-xs" role="listbox" aria-label="نتایج جستجو">
                    {searchResults.slice(0, 12).map(item => (
                      <button key={item.symbol} type="button"
                        onClick={() => openStock(item.symbol)}
                        className="w-full text-right flex justify-between items-center gap-3">
                        <span>{item.symbol}</span>
                        <span className="text-[var(--text-secondary)] truncate">{item.company_name || item.market}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <div className="app-toolbar" role="group" aria-label="تنظیمات نمایش">
                <button onClick={() => setCurrency(value => value === 'IRR' ? 'IRT' : 'IRR')}
                  className="app-tool-button" title="تغییر واحد پول">
                  <span className="app-tool-label">واحد</span>
                  <strong>{currency === 'IRR' ? 'ریال' : 'تومان'}</strong>
                </button>
                <button onClick={() => setTheme(value => value === 'dark' ? 'light' : 'dark')}
                  className="app-tool-button" title="تغییر پوسته">
                  <span className="app-tool-label">پوسته</span>
                  <strong>{theme === 'dark' ? 'روشن' : 'تیره'}</strong>
                </button>
                <button onClick={() => setPage('account')} className="app-tool-button">
                  <span className="app-tool-label">حساب</span>
                  <strong>{user ? (user.display_name || user.username) : 'ورود'}</strong>
                </button>
              </div>
            </div>
            <div className="app-nav-wrap">
              <nav className="app-nav" aria-label="بخش‌های سامانه">
                {availablePages.map(item => (
                  <button key={item.id} onClick={() => setPage(item.id)}
                    aria-current={page === item.id ? 'page' : undefined}
                    className={'app-nav-item ' + (page === item.id ? 'is-active' : '')}>
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main className="app-main flex-1">
            {authLoading && (
              <div className="px-4 py-2 text-center text-[10px] text-[var(--text-muted)]">در حال بررسی نشست کاربری...</div>
            )}
            {page === 'market' &&
              <MarketDashboardPage onOpenStock={openStock} currency={currency} dateMode="jalali" user={user} />}
            {page === 'stock' &&
              <StockDetailPage symbol={activeSymbol} currency={currency} theme={theme} dateMode="jalali" user={user} />}
            {page === 'account' &&
              <AccountAndPlansPage user={user} setUser={setUser} onOpenAdmin={openAdmin} />}
            {page === 'investor-affinity' && user && user.is_premium &&
              <InvestorAffinityPage theme={theme} currency={currency} />}
            {page === 'site-admin' && user && ['admin','super_admin'].includes(user.role) &&
              <SiteAdminDashboardPage user={user} />}
            {page === 'admin' && user && user.role === 'super_admin' &&
              <AdminDashboardPage />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
