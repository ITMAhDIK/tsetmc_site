<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ره‌نگار بورس | پلتفرم تحلیل چندسهمی سهام‌داران و پرتفوی (TSETMC)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.28.5/babel.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-canvas: #0b0e14;
      --bg-panel: #131722;
      --bg-elevated: #1a202c;
      --border-subtle: #242b3d;
      --text-primary: #e6eaf2;
      --text-secondary: #8b95a8;
      --text-muted: #5f697d;
      --up: #00c853;
      --down: #ff3d00;
      --accent: #2962ff;
    }
    .theme-light {
      --bg-canvas: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-elevated: #f8fafc;
      --border-subtle: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
    }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      margin: 0;
    }
    .num {
      font-variant-numeric: tabular-nums;
      direction: ltr;
      display: inline-block;
    }
    /* A td/th with display inline-block stops behaving as a table cell,
       so its content drifts away from its column header. Table cells keep
       table-cell; inline spans keep inline-block. */
    td.num, th.num {
      display: table-cell;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-canvas); }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
  </style>
  <link rel="stylesheet" href="./ui-refresh.css" />
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // --- 1. API Client ---
    // The dashboard and API are same-origin; cookies must stay on this origin.
    const API_BASE = '';

    async function apiFetch(path, options = {}) {
      const method = String(options.method || 'GET').toUpperCase();
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {}),
      };
      if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(method) && window.__siteCsrf) {
        headers['X-CSRF-Token'] = window.__siteCsrf;
      }
      const res = await fetch(`${API_BASE}${path}`, {
        ...options,
        method,
        credentials: 'same-origin',
        headers,
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `خطای سرور (${res.status})`);
      }
      return res.json();
    }

    // --- 2. Persian Formatters ---
    const FA_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    const toFa = (v) => (v === null || v === undefined ? 'نامشخص' : String(v).replace(/\d/g, d => FA_DIGITS[Number(d)]));
    const fmtNum = (n) => (n === null || n === undefined ? '—' : toFa(new Intl.NumberFormat('en-US').format(Math.round(n))));
    const fmtPct = (p, dec = 3) => (p === null || p === undefined ? '—' : `${toFa(Number(p).toFixed(dec))}٪`);
    // همت = هزار میلیارد تومان (1e12 Toman)؛ همر = هزار میلیارد ریال (1e12 Rial).
    const fmtMoney = (rial, unit = 'IRR') => {
      if (rial === null || rial === undefined) return '—';
      const val = unit === 'IRT' ? rial / 10 : rial;
      const suffix = unit === 'IRT' ? 'تومان' : 'ریال';
      if (Math.abs(val) >= 1e12) return `${toFa((val / 1e12).toFixed(2))} ${unit === 'IRT' ? 'همت' : 'همر'} (${suffix})`;
      if (Math.abs(val) >= 1e9) return `${toFa((val / 1e9).toFixed(2))} میلیارد ${suffix}`;
      return `${fmtNum(val)} ${suffix}`;
    };

    // --- 2b. Jalali <-> Gregorian (jalaali-js algorithm, 33-year cycle;
    // verified in the VM against 10 known pairs + a 7-year round-trip sweep).
    // div/mod truncate toward zero (NOT Math.floor) -- that matters for
    // negative intermediates like (gm-8)/6.
    const _div = (a, b) => ~~(a / b);
    const _mod = (a, b) => a - _div(a, b) * b;
    function _jalCal(jy) {
      const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
      const bl = breaks.length;
      const gy = jy + 621;
      let leapJ = -14, jp = breaks[0], jump = 0;
      for (let i = 1; i < bl; i++) {
        const jm = breaks[i]; jump = jm - jp;
        if (jy < jm) break;
        leapJ += _div(jump, 33) * 8 + _div(_mod(jump, 33), 4);
        jp = jm;
      }
      let n = jy - jp;
      leapJ += _div(n, 33) * 8 + _div(_mod(n, 33) + 3, 4);
      if (_mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
      const leapG = _div(gy, 4) - _div((_div(gy, 100) + 1) * 3, 4) - 150;
      const march = 20 + leapJ - leapG;
      if (jump - n < 6) n = n - jump + _div(jump + 4, 33) * 33;
      let leap = _mod(_mod(n + 1, 33) - 1, 4);
      if (leap === -1) leap = 4;
      return { leap, gy, march };
    }
    function _gregorianToJdn(gy, gm, gd) {
      let d = _div((gy + _div(gm - 8, 6) + 100100) * 1461, 4)
        + _div(153 * _mod(gm + 9, 12) + 2, 5) + gd - 34840408;
      d = d - _div(_div(gy + 100100 + _div(gm - 8, 6), 100) * 3, 4) + 752;
      return d;
    }
    function _jdnToGregorian(jdn) {
      let j = 4 * jdn + 139361631;
      j = j + _div(_div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
      const i = _div(_mod(j, 1461), 4) * 5 + 308;
      const gd = _div(_mod(i, 153), 5) + 1;
      const gm = _mod(_div(i, 153), 12) + 1;
      const gy = _div(j, 1461) - 100100 + _div(8 - gm, 6);
      return { gy, gm, gd };
    }
    function _jalaliToJdn(jy, jm, jd) {
      const r = _jalCal(jy);
      return _gregorianToJdn(r.gy, 3, r.march) + (jm - 1) * 31 - _div(jm - 1, 7) * (jm - 7) + jd - 1;
    }
    function _jdnToJalali(jdn) {
      const gy = _jdnToGregorian(jdn).gy;
      let jy = gy - 621;
      const r = _jalCal(jy);
      const jdn1f = _gregorianToJdn(gy, 3, r.march);
      let jd, jm, k = jdn - jdn1f;
      if (k >= 0) {
        if (k <= 185) { jm = 1 + _div(k, 31); jd = _mod(k, 31) + 1; return { jy, jm, jd }; }
        k -= 186;
      } else {
        jy -= 1; k += 179;
        if (r.leap === 1) k += 1;
      }
      jm = 7 + _div(k, 30); jd = _mod(k, 30) + 1;
      return { jy, jm, jd };
    }
    const _toJalaali = (gy, gm, gd) => _jdnToJalali(_gregorianToJdn(gy, gm, gd));
    const _toGregorian = (jy, jm, jd) => _jdnToGregorian(_jalaliToJdn(jy, jm, jd));
    const _pad2 = (n) => String(n).padStart(2, '0');

    // Global date mode ('jalali' | 'gregorian'), set by App. fmtDate reads
    // it at render time, so toggling re-renders every date in the UI.
    let DATE_MODE = 'jalali';
    const setDateModeGlobal = (m) => { DATE_MODE = m === 'gregorian' ? 'gregorian' : 'jalali'; };
    // Jalali input ('1405-08-23' or '1405/08/23') -> display per DATE_MODE.
    const fmtDate = (jalaliStr) => {
      if (jalaliStr === null || jalaliStr === undefined || jalaliStr === '') return '—';
      const s = String(jalaliStr).replace(/\//g, '-').slice(0, 10);
      const parts = s.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return toFa(s);
      if (DATE_MODE === 'gregorian') {
        const g = _toGregorian(parts[0], parts[1], parts[2]);
        return toFa(`${g.gy}-${_pad2(g.gm)}-${_pad2(g.gd)}`);
      }
      return toFa(`${parts[0]}/${_pad2(parts[1])}/${_pad2(parts[2])}`);
    };
    // Gregorian input ('2024-01-10') -> display per DATE_MODE.
    const fmtGregorianDate = (gregStr) => {
      if (gregStr === null || gregStr === undefined || gregStr === '') return '—';
      const s = String(gregStr).replace(/\//g, '-').slice(0, 10);
      const parts = s.split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return toFa(s);
      if (DATE_MODE === 'gregorian') return toFa(s);
      const j = _toJalaali(parts[0], parts[1], parts[2]);
      return toFa(`${j.jy}/${_pad2(j.jm)}/${_pad2(j.jd)}`);
    };
    // UTC ISO timestamp -> Tehran wall time, 'در تاریخ {date} ساعت {HH:MM}'.
    const fmtDateTime = (iso) => {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      const tehran = new Date(d.getTime() + 3.5 * 3600 * 1000);
      const ds = `${tehran.getUTCFullYear()}-${_pad2(tehran.getUTCMonth() + 1)}-${_pad2(tehran.getUTCDate())}`;
      const ts = `${_pad2(tehran.getUTCHours())}:${_pad2(tehran.getUTCMinutes())}`;
      return `در تاریخ ${fmtGregorianDate(ds)} ساعت ${toFa(ts)}`;
    };

    // --- 2c. Resolved holders: the backend (stock_shareholders)
    // groups one date's rows into identity-resolved holders and
    // returns them as `groups` with a stable group_key. The frontend
    // NEVER merges by name: two rows with the same displayed name
    // (every masked person shows as 'شخص حقیقی') are separate holders
    // unless the backend resolved them to one group. Names are
    // display-only; identity comes from the backend's group_key.
    const BASIS_FA = {
      verified: 'تأییدشده (یک ردیف منبع)',
      inferred: 'استنتاج‌شده (تطابق دقیق)',
      majority_twin: 'دوقلوی اکثریت',
      single: 'تک‌رکورد',
    };
    // Map a backend group to the row shape the holders tables render.
    // The group's pct is the same-date computed one; change, price and
    // value come from the representative (best-tier) member row.
    const groupToRow = (g) => {
      const parts = String(g.group_key || '').split(':');
      return {
        ...g,
        id_scheme: parts[0], shareholder_id: parts.slice(1).join(':'),
        _merged: g.merged_count || 1,
        ownership_percent_calculated: g.ownership_percent,
      };
    };
    // Groups from the backend when present; otherwise each raw row is
    // its own group (no merging at all -- never name-based).
    const resolvedHolders = (res) => {
      if (res && Array.isArray(res.groups) && res.groups.length) {
        return res.groups.map(groupToRow);
      }
      return (res && res.rows ? res.rows : []).map(h => ({
        ...h, _merged: 1, group_key: `${h.id_scheme}:${h.shareholder_id}`,
        basis: 'single', unresolved: false, merged_count: 1,
        members: [{ id_scheme: h.id_scheme, shareholder_id: h.shareholder_id }],
      }));
    };
    // Holders mentioned on the date without any share count, from the
    // backend groups (or raw rows as a fallback). They are listed, not
    // counted as major holders, so the counts stay honest.
    const unquantifiedHolders = (res) => {
      if (res && Array.isArray(res.groups)) {
        return res.groups
          .filter(g => g.shares === null || g.shares === undefined)
          .map(g => g.shareholder_name || g.group_key);
      }
      const names = [];
      for (const h of (res && res.rows ? res.rows : [])) {
        if (h.shares === null || h.shares === undefined) {
          names.push(h.shareholder_name || `${h.id_scheme}:${h.shareholder_id}`);
        }
      }
      return names;
    };

    // --- 3. Reusable UI Components ---
    // Chart with: area/line/candlestick/bar types, event markers, Jalali
    // axis ticks (per DATE_MODE), right-edge anchoring (zooming out never
    // leaves empty space on the right), fullscreen, and simple drawing
    // tools (trend line / rectangle / horizontal line) as an SVG overlay.
    // Markers + ohlc are memoized by the parent (JSON key) so the chart
    // is not rebuilt on every render.
    function LWChart({ data, ohlc, type = 'area', height = 250, theme = 'dark', color = '#2962ff', unitLabel = '٪', markers = [], dateMode = 'jalali', enableDrawing = false, allowFullscreen = true, onHover = null, persistKey = null }) {
      const ref = useRef(null);
      const wrapRef = useRef(null);
      const chartRef = useRef(null);
      const seriesRef = useRef(null);
      const onHoverRef = useRef(onHover);
      onHoverRef.current = onHover;
      const [full, setFull] = useState(false);
      const [tool, setTool] = useState(null);
      const [drawings, setDrawings] = useState([]);
      const [draft, setDraft] = useState(null);
      // Scale controls (TradingView-style, bottom-right): A = auto-scale,
      // L = logarithmic price scale.
      const [scaleMode, setScaleMode] = useState('normal');
      const [autoScale, setAutoScale] = useState(true);
      const [rangeMode, setRangeMode] = useState('all');
      const [indicators, setIndicators] = useState({
        sma20: false, sma50: false, ema20: false, bollinger: false, volume: true,
      });
      const [loadedDrawingsKey, setLoadedDrawingsKey] = useState(null);
      const [, setDrawVersion] = useState(0);

      useEffect(() => {
        setLoadedDrawingsKey(null);
        let loaded = [];
        if (persistKey) {
          try {
            const saved = window.localStorage.getItem('rn-chart:' + persistKey);
            const parsed = saved ? JSON.parse(saved) : [];
            loaded = Array.isArray(parsed) ? parsed.slice(0, 250) : [];
          } catch (e) {
            loaded = [];
          }
        }
        setDrawings(loaded);
        setLoadedDrawingsKey(persistKey || '__disabled__');
      }, [persistKey]);

      useEffect(() => {
        if (!persistKey || loadedDrawingsKey !== persistKey) return;
        try {
          window.localStorage.setItem('rn-chart:' + persistKey,
            JSON.stringify(drawings.slice(-250)));
        } catch (e) { /* local persistence is optional when storage is unavailable */ }
      }, [drawings, loadedDrawingsKey, persistKey]);

      const applyRange = (mode) => {
        setRangeMode(mode);
        const chart = chartRef.current;
        const count = cleanData.length;
        if (!chart || !count) return;
        const sessions = { '1M': 22, '3M': 66, '6M': 132, '1Y': 264, '3Y': 792, 'ALL': count };
        const span = Math.min(count, sessions[mode] || count);
        chart.timeScale().setVisibleLogicalRange({
          from: Math.max(0, count - span), to: count + 1,
        });
      };
      const markersKey = JSON.stringify(markers || []);

      const cleanData = useMemo(() => {
        if (type === 'candlestick' || type === 'bar') {
          const rows = Array.isArray(ohlc) ? ohlc : (Array.isArray(data) ? data : []);
          const byTime = new Map();
          for (const item of rows) {
            if (!item || !item.time) continue;
            const o = Number(item.open), h = Number(item.high), l = Number(item.low), c = Number(item.close);
            if ([o, h, l, c].some(v => v === null || v === undefined || isNaN(v))) continue;
            byTime.set(String(item.time).slice(0, 10), { time: String(item.time).slice(0, 10), open: o, high: h, low: l, close: c });
          }
          return Array.from(byTime.values()).sort((a, b) => a.time.localeCompare(b.time));
        }
        if (!Array.isArray(data)) return [];
        const byTime = new Map();
        for (const item of data) {
          if (item && item.time && item.value !== null && item.value !== undefined && !isNaN(Number(item.value))) {
            byTime.set(String(item.time).slice(0, 10), { time: String(item.time).slice(0, 10), value: Number(item.value) });
          }
        }
        return Array.from(byTime.values()).sort((a, b) => a.time.localeCompare(b.time));
      }, [data, ohlc, type]);

      useEffect(() => {
        if (!ref.current || !window.LightweightCharts || cleanData.length === 0) return;
        const isLight = theme === 'light';
        const tickFmt = (time) => fmtGregorianDate(String(time).slice(0, 10));
        const chart = window.LightweightCharts.createChart(ref.current, {
          height,
          layout: {
            background: { type: 'solid', color: isLight ? '#ffffff' : '#131722' },
            textColor: isLight ? '#475569' : '#8b95a8',
            fontFamily: 'Vazirmatn, sans-serif',
          },
          grid: {
            vertLines: { color: isLight ? '#e2e8f0' : '#1e2536' },
            horzLines: { color: isLight ? '#e2e8f0' : '#1e2536' },
          },
          rightPriceScale: {
            borderColor: isLight ? '#cbd5e1' : '#242b3d',
            mode: scaleMode === 'log' ? 1 : (scaleMode === 'percentage' ? 2 : 0),
            autoScale,
          },
          timeScale: { borderColor: isLight ? '#cbd5e1' : '#242b3d', timeVisible: false, tickMarkFormatter: tickFmt },
          localization: {
            priceFormatter: (p) => `${p.toFixed(2)} ${unitLabel}`,
            timeFormatter: (time) => fmtGregorianDate(String(time).slice(0, 10)),
          },
        });
        let series;
        if (type === 'candlestick') {
          series = chart.addCandlestickSeries({ upColor: '#00c853', downColor: '#ff3d00', wickUpColor: '#00c853', wickDownColor: '#ff3d00', borderVisible: false });
        } else if (type === 'bar') {
          series = chart.addBarSeries({ upColor: '#00c853', downColor: '#ff3d00' });
        } else if (type === 'line') {
          series = chart.addLineSeries({ color, lineWidth: 2 });
        } else {
          series = chart.addAreaSeries({ lineColor: color, topColor: `${color}55`, bottomColor: `${color}05`, lineWidth: 2 });
        }
        series.setData(cleanData);

        // Optional moving averages and Bollinger bands. These are computed
        // client-side from the visible price series and never reveal holder rows.
        const closeRows = cleanData.map(row => ({
          time: row.time,
          close: row.close !== undefined ? Number(row.close) : Number(row.value),
        }));
        const overlaySeries = [];
        const addIndicator = (rows, lineColor, title, width = 1) => {
          if (!rows.length) return;
          const line = chart.addLineSeries({
            color: lineColor, lineWidth: width, title,
            priceLineVisible: false, lastValueVisible: false,
            crosshairMarkerVisible: false,
          });
          line.setData(rows);
          overlaySeries.push(line);
        };
        const averageRows = (period, exponential = false) => {
          const out = [];
          let ema = null;
          const alpha = 2 / (period + 1);
          for (let i = 0; i < closeRows.length; i++) {
            const value = closeRows[i].close;
            if (!Number.isFinite(value)) continue;
            if (exponential) {
              ema = ema === null ? value : (alpha * value + (1 - alpha) * ema);
              if (i >= period - 1) out.push({ time: closeRows[i].time, value: ema });
            } else if (i >= period - 1) {
              const windowRows = closeRows.slice(i - period + 1, i + 1);
              if (windowRows.length === period) {
                out.push({ time: closeRows[i].time,
                  value: windowRows.reduce((sum, item) => sum + item.close, 0) / period });
              }
            }
          }
          return out;
        };
        if (indicators.sma20) addIndicator(averageRows(20), '#f5a623', 'SMA 20', 1);
        if (indicators.sma50) addIndicator(averageRows(50), '#ab47bc', 'SMA 50', 1);
        if (indicators.ema20) addIndicator(averageRows(20, true), '#26a69a', 'EMA 20', 1);
        if (indicators.bollinger) {
          const upper = [], lower = [];
          for (let i = 19; i < closeRows.length; i++) {
            const values = closeRows.slice(i - 19, i + 1).map(x => x.close);
            if (values.some(v => !Number.isFinite(v))) continue;
            const mean = values.reduce((sum, v) => sum + v, 0) / values.length;
            const variance = values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / values.length;
            const delta = Math.sqrt(variance) * 2;
            upper.push({ time: closeRows[i].time, value: mean + delta });
            lower.push({ time: closeRows[i].time, value: mean - delta });
          }
          addIndicator(upper, '#78909c', 'BB Upper', 1);
          addIndicator(lower, '#78909c', 'BB Lower', 1);
        }

        // Daily volume is displayed in its own compressed lower scale.
        if (indicators.volume && Array.isArray(ohlc) && ohlc.length) {
          const volumeRows = ohlc.filter(row => row && row.time && Number(row.volume) > 0)
            .map(row => ({
              time: String(row.time).slice(0, 10),
              value: Number(row.volume),
              color: Number(row.close) >= Number(row.open) ? '#26a69a55' : '#ef535055',
            }));
          if (volumeRows.length) {
            const volumeSeries = chart.addHistogramSeries({
              priceScaleId: 'volume',
              priceFormat: { type: 'volume' },
              lastValueVisible: false,
              priceLineVisible: false,
            });
            volumeSeries.setData(volumeRows);
            chart.priceScale('volume').applyOptions({
              scaleMargins: { top: 0.82, bottom: 0 },
              visible: false,
            });
          }
        }

        const parsedMarkers = JSON.parse(markersKey || '[]');
        if (parsedMarkers.length > 0) {
          try { series.setMarkers(parsedMarkers); } catch (e) { /* markers on missing times are ignored */ }
        }
        chart.timeScale().fitContent();
        if (rangeMode !== 'all') {
          const sessions = { '1M': 22, '3M': 66, '6M': 132, '1Y': 264, '3Y': 792 };
          const span = Math.min(cleanData.length, sessions[rangeMode.toUpperCase()] || cleanData.length);
          chart.timeScale().setVisibleLogicalRange({
            from: Math.max(0, cleanData.length - span), to: cleanData.length + 1,
          });
        }
        // Right-edge anchor: zooming out must never leave empty space on
        // the right; clamp the visible range so the last bar stays at the
        // right edge (2 bars of breathing room).
        const lastIdx = cleanData.length - 1;
        const clampRight = (range) => {
          if (!range) return;
          if (range.to > lastIdx + 2) {
            const span = range.to - range.from;
            chart.timeScale().setVisibleLogicalRange({ from: lastIdx + 2 - span, to: lastIdx + 2 });
          }
        };
        chart.timeScale().subscribeVisibleLogicalRangeChange(clampRight);
        const bumpDraw = () => setDrawVersion(v => v + 1);
        chart.timeScale().subscribeVisibleTimeRangeChange(bumpDraw);
        chart.subscribeCrosshairMove(bumpDraw);
        if (onHoverRef.current) {
          chart.subscribeCrosshairMove((param) => {
            const cb = onHoverRef.current;
            if (!cb) return;
            if (!param || !param.time) { cb(null); return; }
            cb({
              time: String(param.time).slice(0, 10),
              x: param.point ? param.point.x : null,
              y: param.point ? param.point.y : null,
            });
          });
        }
        chartRef.current = chart;
        seriesRef.current = series;

        const ro = new ResizeObserver(() => {
          if (ref.current) chart.applyOptions({ width: ref.current.clientWidth });
        });
        ro.observe(ref.current);
        return () => { ro.disconnect(); chart.remove(); chartRef.current = null; seriesRef.current = null; };
      }, [cleanData, height, theme, color, unitLabel, type, markersKey, dateMode, scaleMode, autoScale, indicators]);

      // --- drawing overlay ---
      const pointFromEvent = (e) => {
        const chart = chartRef.current, series = seriesRef.current, wrap = wrapRef.current;
        if (!chart || !series || !wrap) return null;
        const rect = wrap.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        let time = null;
        try { time = chart.timeScale().coordinateToTime(x); } catch (err) { time = null; }
        let price = null;
        try { price = series.coordinateToPrice(y); } catch (err) { price = null; }
        if (time === null || time === undefined || price === null || price === undefined || isNaN(price)) return null;
        return { time: String(time).slice(0, 10), price };
      };
      const onOverlayDown = (e) => {
        if (!tool) return;
        const p = pointFromEvent(e);
        if (!p) return;
        if (tool === 'hline') {
          setDrawings(ds => [...ds, { id: Date.now() + Math.random(), kind: 'hline', price: p.price }]);
          setTool(null);
          return;
        }
        setDraft({ kind: tool, p1: p, p2: p });
      };
      const onOverlayMove = (e) => {
        if (!draft) return;
        const p = pointFromEvent(e);
        if (!p) return;
        setDraft(d => d ? { ...d, p2: p } : d);
      };
      const onOverlayUp = () => {
        if (!draft) return;
        setDrawings(ds => [...ds, { id: Date.now() + Math.random(), ...draft }]);
        setDraft(null);
      };
      const drawingXY = (d) => {
        const chart = chartRef.current, series = seriesRef.current;
        if (!chart || !series) return null;
        const toXY = (p) => {
          const x = chart.timeScale().timeToCoordinate(p.time);
          const y = series.priceToCoordinate(p.price);
          return (x === null || x === undefined || y === null || y === undefined) ? null : { x, y };
        };
        if (d.kind === 'hline') {
          const y = series.priceToCoordinate(d.price);
          return (y === null || y === undefined) ? null : { hlineY: y };
        }
        const a = toXY(d.p1), b = toXY(d.p2);
        return (a && b) ? { a, b } : null;
      };
      const renderDrawings = () => {
        const wrap = wrapRef.current;
        if (!wrap) return null;
        const W = wrap.clientWidth, H = wrap.clientHeight;
        const all = draft ? [...drawings, { ...draft, id: 'draft' }] : drawings;
        return (
          <svg className="absolute inset-0 pointer-events-none" width={W} height={H} style={{ zIndex: 5 }}>
            {all.map(d => {
              const xy = drawingXY(d);
              if (!xy) return null;
              if (d.kind === 'hline') {
                return (
                  <g key={d.id}>
                    <line x1={0} y1={xy.hlineY} x2={W} y2={xy.hlineY} stroke="#f59e0b" strokeWidth={1.5} strokeDasharray="6 3" />
                    <text x={W - 4} y={xy.hlineY - 4} fill="#f59e0b" fontSize={10} textAnchor="end">{toFa(Number(d.price).toFixed(2))}</text>
                  </g>
                );
              }
              if (d.kind === 'rect') {
                const x = Math.min(xy.a.x, xy.b.x), y = Math.min(xy.a.y, xy.b.y);
                return <rect key={d.id} x={x} y={y} width={Math.abs(xy.b.x - xy.a.x)} height={Math.abs(xy.b.y - xy.a.y)} fill="#2962ff22" stroke="#2962ff" strokeWidth={1.5} />;
              }
              if (d.kind === 'fib') {
                const ratios = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
                const low = Math.min(d.p1.price, d.p2.price);
                const high = Math.max(d.p1.price, d.p2.price);
                return <g key={d.id}>
                  {ratios.map(ratio => {
                    const price = low + (high - low) * ratio;
                    const y = seriesRef.current ? seriesRef.current.priceToCoordinate(price) : null;
                    if (y === null || y === undefined) return null;
                    return <g key={ratio}>
                      <line x1={Math.min(xy.a.x, xy.b.x)} y1={y}
                        x2={Math.max(xy.a.x, xy.b.x)} y2={y}
                        stroke="#e0a93b" strokeWidth={1} strokeDasharray="4 3" />
                      <text x={Math.max(xy.a.x, xy.b.x) - 3} y={y - 3}
                        fill="#e0a93b" fontSize={9} textAnchor="end">{(ratio * 100).toFixed(1)}%</text>
                    </g>;
                  })}
                </g>;
              }
              return <line key={d.id} x1={xy.a.x} y1={xy.a.y} x2={xy.b.x} y2={xy.b.y} stroke="#00c853" strokeWidth={2} />;
            })}
          </svg>
        );
      };

      if (!window.LightweightCharts) return <div className="p-4 text-xs text-amber-400">کتابخانه نمودار بارگذاری نشد.</div>;
      if (cleanData.length === 0) return <div className="p-6 text-center text-xs text-[var(--text-secondary)]">سری زمانی معتبری برای رسم نمودار در این بازه موجود نیست.</div>;
      return (
        <div ref={wrapRef} className={full ? 'fixed inset-0 z-[100] bg-[var(--bg-canvas)] p-4 flex flex-col' : 'relative w-full'}>
          <div className="flex flex-wrap gap-1 items-center mb-1.5 text-[10px]" dir="rtl">
            {allowFullscreen && <button onClick={() => setFull(f => !f)}
              className="px-2 py-1 rounded border border-[var(--border-subtle)] bg-[var(--bg-elevated)]">
              {full ? 'خروج از تمام‌صفحه' : 'تمام‌صفحه'}</button>}
            <span className="text-[var(--text-muted)]">بازه</span>
            {['1M','3M','6M','1Y','3Y','ALL'].map(mode =>
              <button key={mode} onClick={() => applyRange(mode)}
                className={`px-2 py-1 rounded border ${rangeMode.toUpperCase() === mode ? 'border-blue-500 bg-blue-600 text-white' : 'border-[var(--border-subtle)] bg-[var(--bg-elevated)]'}`}>{mode}</button>)}
            <span className="mx-1 text-[var(--text-muted)]">اندیکاتور</span>
            {[
              ['sma20','SMA 20'],['sma50','SMA 50'],['ema20','EMA 20'],
              ['bollinger','Bollinger'],['volume','حجم'],
            ].map(([key,label]) => <button key={key}
              onClick={() => setIndicators(v => ({...v,[key]:!v[key]}))}
              className={`px-2 py-1 rounded border ${indicators[key] ? 'border-blue-500 text-blue-300 bg-blue-500/15' : 'border-[var(--border-subtle)] bg-[var(--bg-elevated)] text-[var(--text-secondary)]'}`}>{label}</button>)}
            {enableDrawing && <>
              <span className="mx-1 text-[var(--text-muted)]">ترسیم</span>
              <button onClick={() => setTool(t => t === 'line' ? null : 'line')} className={`px-2 py-1 rounded border ${tool === 'line' ? 'bg-emerald-600 text-white' : 'border-[var(--border-subtle)] bg-[var(--bg-elevated)]'}`}>خط روند</button>
              <button onClick={() => setTool(t => t === 'rect' ? null : 'rect')} className={`px-2 py-1 rounded border ${tool === 'rect' ? 'bg-blue-600 text-white' : 'border-[var(--border-subtle)] bg-[var(--bg-elevated)]'}`}>مستطیل</button>
              <button onClick={() => setTool(t => t === 'hline' ? null : 'hline')} className={`px-2 py-1 rounded border ${tool === 'hline' ? 'bg-amber-600 text-white' : 'border-[var(--border-subtle)] bg-[var(--bg-elevated)]'}`}>خط افقی</button>
              <button onClick={() => setTool(t => t === 'fib' ? null : 'fib')} className={`px-2 py-1 rounded border ${tool === 'fib' ? 'bg-amber-600 text-white' : 'border-[var(--border-subtle)] bg-[var(--bg-elevated)]'}`}>فیبوناچی</button>
              <button onClick={() => setDrawings(ds => ds.slice(0, -1))} disabled={!drawings.length} className="px-2 py-1 rounded border border-[var(--border-subtle)] bg-[var(--bg-elevated)] disabled:opacity-40">بازگشت</button>
              <button onClick={() => setDrawings([])} disabled={!drawings.length} className="px-2 py-1 rounded border border-[var(--border-subtle)] bg-[var(--bg-elevated)] disabled:opacity-40">پاک‌کردن</button>
            </>}
            {tool && <span className="text-amber-300">ابزار {tool === 'fib' ? 'فیبوناچی' : tool === 'hline' ? 'خط افقی' : tool === 'rect' ? 'مستطیل' : 'خط روند'} فعال است</span>}
          </div>
          <div className="relative flex-1" style={full ? { minHeight: 0 } : undefined}>
            <div ref={ref} className="w-full" dir="ltr" />
            <div className="absolute bottom-1 right-1 z-10 flex gap-1" dir="ltr">
              <button title="مقیاس خودکار (Auto scale)" onClick={() => setAutoScale(a => !a)} className={`w-6 h-6 rounded border text-[11px] font-bold ${autoScale ? 'bg-blue-600 text-white border-blue-600' : 'bg-[var(--bg-elevated)] border-[var(--border-subtle)]'}`}>A</button>
              <button title="مقیاس لگاریتمی" onClick={() => setScaleMode(m => m === 'log' ? 'normal' : 'log')} className={`w-6 h-6 rounded border text-[10px] font-bold ${scaleMode === 'log' ? 'bg-blue-600 text-white border-blue-600' : 'bg-[var(--bg-elevated)] border-[var(--border-subtle)]'}`}>LOG</button>
              <button title="مقیاس درصدی" onClick={() => setScaleMode(m => m === 'percentage' ? 'normal' : 'percentage')} className={`w-6 h-6 rounded border text-[10px] font-bold ${scaleMode === 'percentage' ? 'bg-blue-600 text-white border-blue-600' : 'bg-[var(--bg-elevated)] border-[var(--border-subtle)]'}`}>%</button>
            </div>
            {enableDrawing && (
              <div
                className="absolute inset-0"
                style={{ zIndex: 4, pointerEvents: tool || draft ? 'auto' : 'none', cursor: tool ? 'crosshair' : 'default' }}
                onMouseDown={onOverlayDown}
                onMouseMove={onOverlayMove}
                onMouseUp={onOverlayUp}
                onMouseLeave={() => setDraft(null)}
              />
            )}
            {renderDrawings()}
          </div>
        </div>
      );
    }

    const IdentityBadge = ({ status }) => {
      const map = {
        verified_same_source_row: { text: 'تأییدشده (هم‌ردیف منبع)', cls: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' },
        inferred_exact_match: { text: 'تطبیق دقیق استنتاجی', cls: 'bg-blue-500/15 text-blue-400 border-blue-500/30' },
        unlinked_record_id: { text: 'شناسه منفرد (تأییدنشده)', cls: 'bg-amber-500/15 text-amber-400 border-amber-500/30' },
        ambiguous_not_linked: { text: 'مبهم / پیوند نشده', cls: 'bg-orange-500/15 text-orange-400 border-orange-500/30' },
        source_id: { text: 'بدون اطلاعات پیوند (منبع)', cls: 'bg-slate-500/15 text-slate-400 border-slate-500/30' },
      };
      const item = map[status];
      if (!item) return <span className="px-1.5 py-0.5 text-[10px] rounded border bg-slate-500/15 text-slate-400 border-slate-500/30">{status || '—'}</span>;
      return <span className={`px-1.5 py-0.5 text-[10px] rounded border ${item.cls}`}>{item.text}</span>;
    };

    const ErrorBox = ({ error }) => error ? (
      <div className="p-3 rounded border border-red-500/40 bg-red-500/10 text-red-300 text-xs">{error}</div>
    ) : null;

    // --- 4. Market overview: aggregate-only and sector-first ---
    function MarketDashboardPage({ onOpenStock, currency, dateMode, user }) {
      const [overview, setOverview] = useState(null);
      const [watch, setWatch] = useState({ total: 0, rows: [] });
      const [groups, setGroups] = useState([]);
      const [market, setMarket] = useState('ALL');
      const [query, setQuery] = useState('');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [mapping, setMapping] = useState({});
      const [editing, setEditing] = useState(false);
      const [saving, setSaving] = useState(false);
      const [notice, setNotice] = useState('');

      const loadGroups = useCallback(() => {
        apiFetch('/api/v1/market/groups?market=' + encodeURIComponent(market))
          .then(res => setGroups(res.groups || []))
          .catch(e => setError(e.message));
      }, [market]);

      useEffect(() => {
        apiFetch('/api/v1/market/overview')
          .then(setOverview).catch(e => setError(e.message));
      }, []);

      useEffect(() => {
        let cancelled = false;
        const timer = setTimeout(() => {
          setLoading(true);
          const params = new URLSearchParams({
            q: query, market: market, sort_by: 'market_value',
            sort_dir: 'DESC', limit: '50', offset: '0',
          });
          apiFetch('/api/v1/market/watch?' + params.toString())
            .then(res => { if (!cancelled) setWatch(res); })
            .catch(e => { if (!cancelled) setError(e.message); })
            .finally(() => { if (!cancelled) setLoading(false); });
        }, 180);
        return () => { cancelled = true; clearTimeout(timer); };
      }, [query, market]);

      useEffect(() => { loadGroups(); }, [loadGroups]);

      useEffect(() => {
        if (!user) { setMapping({}); return; }
        apiFetch('/api/v1/market/sector-config')
          .then(res => setMapping(res.mapping || {}))
          .catch(() => setMapping({}));
      }, [user && user.id]);

      const updateMapping = (code, value) => {
        setMapping(current => {
          const next = { ...current };
          if (String(value || '').trim()) next[code] = String(value).trim();
          else delete next[code];
          return next;
        });
      };

      const saveMapping = async () => {
        setSaving(true);
        setNotice('');
        try {
          await apiFetch('/api/v1/market/sector-config', {
            method: 'PUT', body: JSON.stringify({ mapping }),
          });
          setEditing(false);
          setNotice('گروه‌بندی اختصاصی ذخیره شد.');
          loadGroups();
        } catch (e) { setError(e.message); }
        finally { setSaving(false); }
      };

      const summary = overview && overview.summary ? overview.summary : {};
      const totalGroupValue = groups.reduce((sum, item) =>
        sum + (Number(item.market_value_rial) || 0), 0);

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div>
              <div className="text-[11px] text-[var(--text-secondary)]">داشبورد تحلیلی بازار</div>
              <h1 className="text-xl font-bold mt-1">نمای کلی بازار و گروه‌های صنعتی</h1>
              <p className="text-xs text-[var(--text-secondary)] mt-1">
                نمایش عمومی فقط شامل شاخص‌ها و تجمیع‌های تحلیلی است؛ ردیف‌های خام سهام‌داری و شناسه‌های اشخاص منتشر نمی‌شوند.
              </p>
            </div>
            <select value={market} onChange={e => setMarket(e.target.value)}
              className="px-3 py-2 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-panel)] text-xs">
              <option value="ALL">همه بازارها</option>
              <option value="TSE">بورس</option>
              <option value="IFB">فرابورس</option>
            </select>
          </div>

          <ErrorBox error={error} />
          {notice && <div className="rounded-lg border border-emerald-500/30 bg-emerald-500/10 p-2.5 text-xs text-emerald-300">{notice}</div>}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
            {[
              ['کل نمادهای پوشش‌داده‌شده', summary.total_companies || 0],
              ['نمادهای بورس', summary.tse_companies || 0],
              ['نمادهای فرابورس', summary.ifb_companies || 0],
              ['نمادهای تعیین‌نشده', summary.unknown_market_companies || 0],
            ].map(([label, value]) => (
              <div key={label} className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] p-3">
                <div className="text-[11px] text-[var(--text-secondary)]">{label}</div>
                <div className="text-xl font-bold num mt-1">{fmtNum(value)}</div>
              </div>
            ))}
          </div>

          <section className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-hidden">
            <div className="p-3 border-b border-[var(--border-subtle)] flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 className="font-bold text-sm">نقشهٔ ارزش بازار به تفکیک گروه‌های رسمی</h2>
                <p className="text-[11px] text-[var(--text-secondary)] mt-1">
                  گروه‌بندی بر اساس کد گروه و زیرگروه رسمی ابزارهای بورسی؛ ارقام در سطح گروه تجمیع شده‌اند.
                </p>
              </div>
              {user && user.is_premium ? (
                <button onClick={() => setEditing(v => !v)}
                  className="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs">
                  {editing ? 'بستن ویرایش' : 'ویرایش گروه‌بندی'}
                </button>
              ) : (
                <span className="text-[11px] px-2.5 py-1.5 rounded-lg border border-amber-500/30 text-amber-300">
                  ویرایش گروه‌ها مخصوص Premium
                </span>
              )}
            </div>

            {editing && user && user.is_premium && (
              <div className="p-3 border-b border-[var(--border-subtle)] bg-[var(--bg-elevated)] space-y-2">
                <p className="text-[11px] text-[var(--text-secondary)]">
                  نام یکسان برای چند کد، آن‌ها را در یک گروه اختصاصی ادغام می‌کند. خالی‌کردن نام، عنوان رسمی بورس را برمی‌گرداند.
                </p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                  {groups.flatMap(group => (group.official_group_codes || []).map(code => (
                    <label key={code} className="flex items-center gap-2 text-xs">
                      <span className="w-16 text-[var(--text-muted)] num">{code}</span>
                      <input value={mapping[code] || ''}
                        placeholder={group.label}
                        onChange={e => updateMapping(code, e.target.value)}
                        className="min-w-0 flex-1 px-2.5 py-2 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)]" />
                    </label>
                  )))}
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setMapping({})}
                    className="px-3 py-2 rounded border border-[var(--border-subtle)] text-xs">بازنشانی به رسمی</button>
                  <button onClick={saveMapping} disabled={saving}
                    className="px-3 py-2 rounded bg-emerald-600 text-white text-xs disabled:opacity-50">
                    {saving ? 'در حال ذخیره...' : 'ذخیره گروه‌بندی'}
                  </button>
                </div>
              </div>
            )}

            <div className="p-3 grid grid-cols-1 lg:grid-cols-2 gap-3">
              {groups.length === 0 ? (
                <div className="text-xs text-[var(--text-secondary)] p-5">اطلاعات دسته‌بندی رسمی هنوز روی سرور نصب نشده است.</div>
              ) : groups.map((group, index) => (
                <div key={group.label + '-' + index} className="rounded-lg border border-[var(--border-subtle)] p-3">
                  <div className="flex items-center justify-between gap-3 mb-2">
                    <div className="font-semibold text-sm truncate">{group.label}</div>
                    <span className="text-[11px] text-[var(--text-secondary)] num">{fmtNum(group.instrument_count)} نماد</span>
                  </div>
                  <div className="h-2 rounded-full bg-[var(--bg-elevated)] overflow-hidden">
                    <div className="h-full rounded-full bg-blue-500"
                      style={{ width: Math.max(0, Math.min(100, group.market_share_pct || 0)) + '%' }} />
                  </div>
                  <div className="flex items-center justify-between mt-2 text-[11px]">
                    <span className="text-[var(--text-secondary)]">{fmtPct(group.market_share_pct, 2)} از ارزش گروه‌های قابل مشاهده</span>
                    <strong className="num">{fmtMoney(group.market_value_rial, currency)}</strong>
                  </div>
                  {group.subgroups && group.subgroups.length > 0 && (
                    <div className="mt-2 flex flex-wrap gap-1">
                      {group.subgroups.slice(0, 5).map(sub => (
                        <span key={sub.label} className="px-2 py-1 rounded bg-[var(--bg-elevated)] text-[10px] text-[var(--text-secondary)]">
                          {sub.label}
                        </span>
                      ))}
                      {group.subgroups.length > 5 && <span className="text-[10px] text-[var(--text-muted)]">و زیرگروه‌های دیگر</span>}
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div className="px-3 pb-3 text-[10px] text-[var(--text-muted)]">
              مبنای درصدها ارزش بازار تجمیعی نمادهای دارای قیمت/ارزش معتبر است؛ موارد بدون طبقه‌بندی رسمی در گروه «سایر» قرار می‌گیرند.
            </div>
          </section>

          <section className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-hidden">
            <div className="p-3 border-b border-[var(--border-subtle)] flex flex-wrap justify-between items-center gap-2">
              <div>
                <h2 className="font-bold text-sm">نمادها و ارزش بازار</h2>
                <p className="text-[11px] text-[var(--text-secondary)] mt-1">
                  فهرست نمادها فقط اطلاعات عمومی بازار را نشان می‌دهد؛ ستون‌های مالکیت و داده‌های سهام‌داری حذف شده‌اند.
                </p>
              </div>
              <input value={query} onChange={e => setQuery(e.target.value)}
                placeholder="جستجوی نماد یا شرکت..."
                className="px-3 py-2 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-canvas)] text-xs w-56" />
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-xs text-right">
                <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                  <tr>
                    <th className="p-3">نماد</th>
                    <th className="p-3">شرکت</th>
                    <th className="p-3">بازار</th>
                    <th className="p-3">آخرین قیمت</th>
                    <th className="p-3">ارزش بازار</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-[var(--border-subtle)]">
                  {loading ? (
                    <tr><td colSpan="5" className="p-6 text-center text-[var(--text-secondary)]">در حال بارگذاری...</td></tr>
                  ) : watch.rows.length === 0 ? (
                    <tr><td colSpan="5" className="p-6 text-center text-[var(--text-secondary)]">نمادی یافت نشد.</td></tr>
                  ) : watch.rows.map(row => (
                    <tr key={row.symbol} onClick={() => onOpenStock(row.symbol)}
                      className="hover:bg-[var(--bg-elevated)] cursor-pointer">
                      <td className="p-3 font-bold text-blue-400">{row.symbol}</td>
                      <td className="p-3">{row.company_name || '—'}</td>
                      <td className="p-3 text-[var(--text-secondary)]">{row.market}</td>
                      <td className="p-3 num">{fmtMoney(row.latest_price, currency)}</td>
                      <td className="p-3 num font-semibold">{fmtMoney(row.market_value, currency)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="p-3 border-t border-[var(--border-subtle)] text-[11px] text-[var(--text-secondary)]">
              تعداد نمادهای منطبق با جستجو: {fmtNum(watch.total)}
            </div>
          </section>
        </div>
      );
    }

    // --- 5. Stock page: price analysis only, no company/holder history ---
    function StockDetailPage({ symbol, currency, theme, dateMode, user }) {
      const [detail, setDetail] = useState(null);
      const [prices, setPrices] = useState([]);
      const [events, setEvents] = useState([]);
      const [chartType, setChartType] = useState('candlestick');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');

      useEffect(() => {
        if (!symbol) return;
        let cancelled = false;
        setLoading(true);
        setError('');
        Promise.all([
          apiFetch('/api/v1/stocks/' + encodeURIComponent(symbol)),
          apiFetch('/api/v1/stocks/' + encodeURIComponent(symbol) + '/prices'),
          apiFetch('/api/v1/stocks/' + encodeURIComponent(symbol) + '/corporate-actions'),
        ]).then(([stock, priceResult, eventResult]) => {
          if (cancelled) return;
          setDetail(stock);
          setPrices(priceResult.prices || []);
          setEvents(eventResult.events || []);
        }).catch(e => { if (!cancelled) setError(e.message); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [symbol]);

      const metrics = useMemo(() => {
        const valid = prices.filter(row => Number.isFinite(Number(row.close)) && Number(row.close) > 0);
        if (!valid.length) return null;
        const last = valid[valid.length - 1];
        const closeAt = (sessions) => valid[Math.max(0, valid.length - 1 - sessions)].close;
        const pct = (oldValue) => oldValue ? ((last.close / oldValue) - 1) * 100 : null;
        const dailyReturns = [];
        for (let i = Math.max(1, valid.length - 20); i < valid.length; i++) {
          const prev = Number(valid[i - 1].close);
          const next = Number(valid[i].close);
          if (prev > 0) dailyReturns.push((next / prev) - 1);
        }
        const mean = dailyReturns.length
          ? dailyReturns.reduce((sum, value) => sum + value, 0) / dailyReturns.length : 0;
        const variance = dailyReturns.length
          ? dailyReturns.reduce((sum, value) => sum + Math.pow(value - mean, 2), 0) / dailyReturns.length : 0;
        const turnover = valid.slice(-20).map(row =>
          (Number(row.volume) || 0) * (Number(row.close) || 0));
        return {
          latest: last.close,
          oneMonth: pct(Number(closeAt(22))),
          threeMonth: pct(Number(closeAt(66))),
          oneYear: pct(Number(closeAt(252))),
          annualVolatility: Math.sqrt(variance) * Math.sqrt(252) * 100,
          averageTurnover: turnover.length
            ? turnover.reduce((sum, value) => sum + value, 0) / turnover.length : null,
        };
      }, [prices]);

      const markers = events.map(event => ({
        time: event.date,
        position: 'aboveBar',
        color: event.is_capital_increase ? '#f5a623' : '#78909c',
        shape: event.is_capital_increase ? 'arrowUp' : 'circle',
        text: event.is_capital_increase ? 'افزایش سرمایه' : 'رویداد شرکتی',
      })).filter(item => item.time);

      if (loading) return <div className="p-8 text-center text-xs text-[var(--text-secondary)]">در حال آماده‌سازی تحلیل نماد...</div>;
      if (error) return <ErrorBox error={error} />;
      if (!detail || !detail.instrument) return <div className="p-8 text-center text-xs">نماد یافت نشد.</div>;

      const instrument = detail.instrument;
      const snapshot = detail.latest_snapshot || {};
      const eventCount = events.filter(event => event.is_capital_increase).length;

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <h1 className="text-xl font-bold">{instrument.symbol}</h1>
                <span className="text-xs px-2 py-1 rounded bg-[var(--bg-elevated)] text-[var(--text-secondary)]">{instrument.market || 'بازار نامشخص'}</span>
              </div>
              <div className="text-sm text-[var(--text-secondary)] mt-1">{instrument.company_name || '—'}</div>
            </div>
            <div className="text-left">
              <div className="text-[10px] text-[var(--text-secondary)]">آخرین قیمت ثبت‌شده</div>
              <div className="font-bold text-lg num">{fmtMoney(metrics ? metrics.latest : snapshot.latest_price, currency)}</div>
            </div>
          </div>

          <ErrorBox error={error} />

          <div className="grid grid-cols-2 lg:grid-cols-5 gap-2.5">
            {[
              ['بازده ۱ ماهه', metrics && metrics.oneMonth],
              ['بازده ۳ ماهه', metrics && metrics.threeMonth],
              ['بازده ۱ ساله', metrics && metrics.oneYear],
              ['نوسان‌پذیری سالانه‌شده', metrics && metrics.annualVolatility],
              ['میانگین ارزش معاملات روزانه', metrics && metrics.averageTurnover],
            ].map(([label, value]) => (
              <div key={label} className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] p-3">
                <div className="text-[10px] text-[var(--text-secondary)]">{label}</div>
                <div className="font-bold mt-1 num text-sm">
                  {value === null || value === undefined ? '—' :
                    (label.indexOf('بازده') === 0 || label.indexOf('نوسان') === 0
                      ? fmtPct(value, 2) : fmtMoney(value, currency))}
                </div>
              </div>
            ))}
          </div>

          <section className="rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-hidden">
            <div className="p-3 border-b border-[var(--border-subtle)] flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 className="font-bold text-sm">نمودار قیمت تعدیل‌نشدهٔ روزانه</h2>
                <p className="text-[10px] text-[var(--text-secondary)] mt-1">
                  ابزارهای نمودار و اندیکاتورها روی سری قیمت محاسبه می‌شوند؛ تاریخچهٔ شرکت و ردیف‌های مالکیت نمایش داده نمی‌شود.
                </p>
              </div>
              <div className="flex flex-wrap gap-1">
                {[
                  ['candlestick','کندل'], ['bar','میله‌ای'],
                  ['line','خطی'], ['area','ناحیه‌ای'],
                ].map(([value,label]) => (
                  <button key={value} onClick={() => setChartType(value)}
                    className={'px-2.5 py-1.5 rounded text-[11px] border ' +
                      (chartType === value
                        ? 'bg-blue-600 text-white border-blue-600'
                        : 'bg-[var(--bg-elevated)] border-[var(--border-subtle)]')}>
                    {label}
                  </button>
                ))}
              </div>
            </div>
            <div className="p-2">
              <LWChart
                ohlc={prices}
                data={prices.map(row => ({ time: row.time, value: row.close }))}
                type={chartType}
                height={460}
                theme={theme}
                color="#2962ff"
                unitLabel="ریال"
                markers={markers}
                dateMode="jalali"
                enableDrawing={!!(user && user.is_premium)}
                allowFullscreen={true}
                persistKey={'symbol-' + instrument.symbol}
              />
            </div>
            <div className="px-3 pb-3 flex flex-wrap gap-3 text-[10px] text-[var(--text-secondary)]">
              <span>رویدادهای ثبت‌شده: {fmtNum(events.length)}</span>
              <span>افزایش سرمایه: {fmtNum(eventCount)}</span>
              {user && user.is_premium
                ? <span className="text-emerald-400">ترسیم‌ها در همین مرورگر ذخیره می‌شوند.</span>
                : <span>ابزارهای ترسیم برای اشتراک Premium فعال است.</span>}
            </div>
          </section>
        </div>
      );
    }

    // --- 6. Page 3: Cross-Company Shareholder Intelligence ---
    // --- 6. Page 3: Cross-Company Shareholder Intelligence ---
    // One row per PERSON (grouped by the pipeline's own identity links),
    // not per (holder, symbol). Clicking a holder shows their whole
    // portfolio: first the combined value chart (sum of all symbols),
    // then one chart per company; clicking a company swaps the main
    // chart to that company's series.
    function ShareholderIntelligencePage({ currency, theme, onOpenStock, onOpenInvestor, dateMode }) {
      const [q, setQ] = useState('');
      const [symbolFilter, setSymbolFilter] = useState('');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [minPct, setMinPct] = useState('');
      const [multiOnly, setMultiOnly] = useState(false);
      const [rows, setRows] = useState([]);
      const [selected, setSelected] = useState(null);
      const [portfolio, setPortfolio] = useState(null);
      const [histories, setHistories] = useState({});
      const [mainChart, setMainChart] = useState('combined');
      const [loading, setLoading] = useState(false);
      const [offset, setOffset] = useState(0);

      useEffect(() => {
        const timer = setTimeout(() => {
          setLoading(true);
          const qs = new URLSearchParams({
            q, symbol: symbolFilter, shareholder_type: typeFilter,
            multi_company_only: String(multiOnly), limit: '40', offset: String(offset),
          });
          if (minPct !== '') qs.set('min_ownership', minPct);
          apiFetch(`/api/v1/shareholders/search?${qs.toString()}`)
            .then(res => setRows(res.rows || []))
            .finally(() => setLoading(false));
        }, 250);
        return () => clearTimeout(timer);
      }, [q, symbolFilter, typeFilter, minPct, multiOnly, offset]);

      const loadGroup = (group) => {
        setSelected(group);
        setPortfolio(null);
        setHistories({});
        setMainChart('combined');
        apiFetch(`/api/v1/portfolios/${encodeURIComponent(group.group_id)}`)
          .then(res => setPortfolio(res))
          .catch(() => {});
        // One % history per company, using that symbol's own (scheme, id).
        (group.symbols || []).forEach(s => {
          const qs = new URLSearchParams({
            symbol: s.symbol, id_scheme: s.id_scheme,
            shareholder_id: String(s.shareholder_id),
          });
          apiFetch(`/api/v1/shareholders/observation-history?${qs.toString()}`)
            .then(res => setHistories(prev => ({ ...prev, [s.symbol]: res.history || [] })))
            .catch(() => {});
        });
      };

      const combinedSeries = useMemo(() => {
        // Values in همر (1e12 Rial) in IRR mode, همت (1e12 Toman = 1e13 Rial)
        // in IRT mode -- same divisor as the portfolio page.
        const divisor = currency === 'IRT' ? 1e13 : 1e12;
        return (portfolio?.history_series || []).map(p => ({
          time: p.time,
          value: (p.combined_value_rial || 0) / divisor,
        }));
      }, [portfolio, currency]);

      const valuedPositions = portfolio
        ? [...(portfolio.confirmed_positions || []), ...(portfolio.probable_positions || [])]
        : [];
      const totalValue = portfolio
        ? ((portfolio.summary?.confirmed_combined_value_rial || 0)
           + (portfolio.summary?.probable_combined_value_rial || 0))
        : null;
      const totalShares = valuedPositions.reduce((a, p) => a + (p.shares || 0), 0);

      return (
        <div className="space-y-3 text-xs">
          <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] flex flex-wrap justify-between items-center gap-2">
            <div>
              <h1 className="text-sm font-bold">پایگاه جامع سهام‌داران در تمام شرکت‌های واردشده</h1>
              <p className="text-[11px] text-[var(--text-secondary)]">هر سطر یک سهام‌دار است — با همهٔ شرکت‌هایی که در آن‌ها سهام دارد. جستجو بر اساس نام، شناسه TSETMC، نماد، حداقل درصد مالکیت و حضور هم‌زمان در چند شرکت</p>
            </div>
            <div className="flex flex-wrap gap-2 items-center">
              <input value={q} onChange={e => { setQ(e.target.value); setOffset(0); }} placeholder="نام سهام‌دار یا شناسه..." className="px-2.5 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-52" />
              <input value={symbolFilter} onChange={e => { setSymbolFilter(e.target.value); setOffset(0); }} placeholder="نماد..." className="px-2.5 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-24" />
              <input type="number" value={minPct} onChange={e => { setMinPct(e.target.value); setOffset(0); }} placeholder="حداقل ٪" className="px-2 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-24 num" />
              <select value={typeFilter} onChange={e => { setTypeFilter(e.target.value); setOffset(0); }} className="px-2 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)]">
                <option value="ALL">همه</option>
                <option value="individual">حقیقی</option>
                <option value="legal">حقوقی</option>
              </select>
              <label className="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" checked={multiOnly} onChange={e => { setMultiOnly(e.target.checked); setOffset(0); }} />
                <span>فقط سهام‌داران چندشرکتی</span>
              </label>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
            <div className="lg:col-span-7 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-x-auto">
              <table className="w-full text-right">
                <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                  <tr><th className="p-2">نام سهام‌دار</th><th className="p-2">نمادها</th><th className="p-2">شناسه</th><th className="p-2">بیشترین مالکیت٪</th><th className="p-2">آخرین تغییر</th></tr>
                </thead>
                <tbody className="divide-y divide-[var(--border-subtle)]">
                  {loading ? (
                    <tr><td colSpan="5" className="p-6 text-center text-[var(--text-secondary)]">در حال جستجو...</td></tr>
                  ) : rows.map((r, i) => (
                    <tr key={r.group_id} onClick={() => loadGroup(r)} className="cursor-pointer hover:bg-[var(--bg-elevated)]">
                      <td className="p-2 font-semibold">{r.shareholder_name}</td>
                      <td className="p-2">
                        <span className="font-bold text-blue-400">{toFa(r.n_companies)} شرکت</span>
                        <span className="text-[10px] text-[var(--text-secondary)] block">{(r.symbols || []).slice(0, 3).map(s => s.symbol).join('، ')}{(r.symbols || []).length > 3 ? '…' : ''}</span>
                      </td>
                      <td className="p-2 num text-[10px]">{r.shareholder_id}</td>
                      <td className="p-2 num font-semibold">{fmtPct(r.latest_ownership_pct)}</td>
                      <td className={`p-2 num ${r.latest_shares_change > 0 ? 'text-[var(--up)]' : r.latest_shares_change < 0 ? 'text-[var(--down)]' : ''}`}>{fmtNum(r.latest_shares_change)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="p-2 border-t border-[var(--border-subtle)] flex justify-between">
                <button disabled={offset === 0} onClick={() => setOffset(o => Math.max(0, o - 40))} className="px-2 py-1 rounded border border-[var(--border-subtle)] disabled:opacity-40">صفحه قبل</button>
                <button disabled={rows.length < 40} onClick={() => setOffset(o => o + 40)} className="px-2 py-1 rounded border border-[var(--border-subtle)] disabled:opacity-40">صفحه بعد</button>
              </div>
            </div>

            <div className="lg:col-span-5 p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2.5 lg:sticky lg:top-24 self-start">
              {selected ? (
                <>
                  <div className="flex justify-between items-start gap-2">
                    <div>
                      <div className="font-bold text-sm">{selected.shareholder_name}</div>
                      <div className="text-[11px] text-[var(--text-secondary)]">
                        {selected.shareholder_type === 'legal' ? 'حقوقی' : selected.shareholder_type === 'individual' ? 'حقیقی' : ''} | بازه مشاهده: <span className="num">{fmtDate(selected.first_observed_date_jalali)} تا {fmtDate(selected.last_observed_date_jalali)}</span>
                      </div>
                      <div className="mt-1">
                        ارزش سرمایه‌گذاری: <span className="font-bold num">{totalValue !== null ? fmtMoney(totalValue, currency) : '…'}</span>
                        {' '} | تعداد سهام: <span className="font-bold num">{fmtNum(totalShares)}</span>
                        {' '} | شرکت‌ها: <span className="font-bold num">{toFa(selected.n_companies)}</span>
                      </div>
                    </div>
                    <button onClick={() => onOpenInvestor && onOpenInvestor(selected.group_id)} className="px-2 py-1 rounded border border-blue-500/40 text-blue-400 shrink-0">پرتفوی کامل در تب ۴</button>
                  </div>
                  <div>
                    <div className="font-bold mb-1 flex justify-between items-center">
                      <span>{mainChart === 'combined' ? `مجموع ارزش همهٔ نمادها (${currency === 'IRT' ? 'همت' : 'همر'})` : `روند مالکیت — ${mainChart}`}</span>
                      {mainChart !== 'combined' && (
                        <button onClick={() => setMainChart('combined')} className="px-2 py-0.5 rounded border border-[var(--border-subtle)] text-[11px]">بازگشت به مجموع</button>
                      )}
                    </div>
                    <LWChart data={mainChart === 'combined' ? combinedSeries : (histories[mainChart] || [])} height={220} theme={theme} color="#00c853" unitLabel={mainChart === 'combined' ? (currency === 'IRT' ? 'همت' : 'همر') : '٪'} dateMode={dateMode} />
                  </div>
                  {(selected.symbols || []).length > 0 && (
                    <div className="space-y-2">
                      <div className="font-bold">چارت هر شرکت</div>
                      {selected.symbols.map(s => (
                        <div key={s.symbol} onClick={() => setMainChart(s.symbol)} className={`p-2 rounded border cursor-pointer ${mainChart === s.symbol ? 'border-blue-500/60 bg-blue-500/5' : 'border-[var(--border-subtle)]'}`}>
                          <div className="flex justify-between items-center mb-1">
                            <button onClick={(e) => { e.stopPropagation(); onOpenStock(s.symbol); }} className="font-bold text-blue-400 underline">{s.symbol}</button>
                            <span className="num text-[var(--text-secondary)]">{fmtPct(s.latest_ownership_pct)} | {fmtNum(s.shares)} سهم</span>
                          </div>
                          <LWChart data={histories[s.symbol] || []} height={120} theme={theme} color="#00c853" unitLabel="٪" dateMode={dateMode} />
                        </div>
                      ))}
                    </div>
                  )}
                </>
              ) : (
                <div className="p-8 text-center text-[var(--text-secondary)]">یک سطر را برای مشاهده پرتفوی کامل سهام‌دار انتخاب کنید.</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- 7. Page 4: Investor Portfolio Reconstruction ---
    function PortfolioReconstructionPage({ currency, theme, onOpenStock, dateMode, initialInvestor = '' }) {
      const [invQuery, setInvQuery] = useState('');
      const [invSort, setInvSort] = useState('linked');
      const [investors, setInvestors] = useState([]);
      const [selectedId, setSelectedId] = useState('');
      const [idInput, setIdInput] = useState('');
      const [asOfDate, setAsOfDate] = useState('');
      const [portfolio, setPortfolio] = useState(null);
      const [loading, setLoading] = useState(false);
      const [compQuery, setCompQuery] = useState('');
      const [compResults, setCompResults] = useState([]);
      const [compSymbol, setCompSymbol] = useState('');
      const [compHolders, setCompHolders] = useState([]);
      const [compLoading, setCompLoading] = useState(false);
      // Historical observations are fetched only for the selected security,
      // in bounded pages; the full investor ledger is never loaded at once.
      const [historyInsCode, setHistoryInsCode] = useState('');
      const [historyOffset, setHistoryOffset] = useState(0);
      const [historyData, setHistoryData] = useState(null);
      const [historyLoading, setHistoryLoading] = useState(false);
      const HISTORY_PAGE_SIZE = 100;

      // Open a specific investor (e.g. clicked on a holder on the
      // dashboard): the dashboard passes "scheme:id".
      useEffect(() => { if (initialInvestor) setSelectedId(initialInvestor); }, [initialInvestor]);

      // Direct ID entry: "share_id:123456" / "ondate_share_id:123456",
      // or a bare number (treated as share_id).
      const applyIdInput = () => {
        const v = idInput.trim();
        if (!v) return;
        setSelectedId(v.includes(':') ? v : `share_id:${v}`);
      };

      // Find an investor through a company: search the company, pick it,
      // and its shareholders appear below -- click one to load them.
      useEffect(() => {
        if (!compQuery.trim()) { setCompResults([]); return; }
        const timer = setTimeout(() => {
          apiFetch(`/api/v1/stocks/search?q=${encodeURIComponent(compQuery.trim())}&limit=8`)
            .then(res => setCompResults(res.results || []))
            .catch(() => {});
        }, 200);
        return () => clearTimeout(timer);
      }, [compQuery]);

      useEffect(() => {
        if (!compSymbol) { setCompHolders([]); return; }
        setCompLoading(true);
        apiFetch(`/api/v1/stocks/${encodeURIComponent(compSymbol)}/shareholders`)
          .then(res => setCompHolders(res.rows || []))
          .catch(() => setCompHolders([]))
          .finally(() => setCompLoading(false));
      }, [compSymbol]);

      useEffect(() => {
        const timer = setTimeout(() => {
          apiFetch(`/api/v1/portfolios/investors?q=${encodeURIComponent(invQuery)}&limit=30&sort_by=${invSort}`)
            .then(res => {
              const list = res.investors || [];
              setInvestors(list);
              if (!selectedId && list.length > 0) setSelectedId(list[0].id);
            });
        }, 200);
        return () => clearTimeout(timer);
      }, [invQuery, invSort]);

      useEffect(() => {
        if (!selectedId) return;
        setLoading(true);
        const qs = asOfDate ? `?as_of_date=${encodeURIComponent(asOfDate)}` : '';
        apiFetch(`/api/v1/portfolios/${encodeURIComponent(selectedId)}${qs}`)
          .then(setPortfolio)
          .finally(() => setLoading(false));
      }, [selectedId, asOfDate]);

      useEffect(() => {
        setHistoryInsCode('');
        setHistoryOffset(0);
        setHistoryData(null);
      }, [selectedId, asOfDate]);

      useEffect(() => {
        if (!selectedId || !historyInsCode) {
          setHistoryData(null);
          return;
        }
        let active = true;
        setHistoryLoading(true);
        const params = new URLSearchParams({
          ins_code: historyInsCode,
          limit: String(HISTORY_PAGE_SIZE),
          offset: String(historyOffset),

        return () => { active = false; };

        net_decrease: 'کاهش خالص مشاهده‌شده؛ فروش قطعی نیست',

                    <div>پوزیشن‌ها بر اساس سطح اطمینان — تأییدشده: <span className="num">{toFa(portfolio.identity_evidence.positions_by_tier?.confirmed || 0)}</span>، محتمل: <span className="num">{toFa(portfolio.identity_evidence.positions_by_tier?.probable || 0)}</span>، غیرقطعی: <span className="num">{toFa(portfolio.identity_evidence.positions_by_tier?.uncertain || 0)}</span></div>

                    <p className="mt-1 text-[11px] text-[var(--text-secondary)]">تخصیص فعلی، گرایش تاریخی و تغییر خالص اخیر جداگانه محاسبه می‌شوند؛ این خروجی اثبات معامله نیست.</p>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-3">
                      <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">ارزش مشاهده‌شده</div><div className="font-bold num mt-1">{fmtMoney(portfolio.sector_affinity.current_portfolio_value_rial, currency)}</div></div>
                      <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">اطمینان داده</div><div className="font-bold num mt-1">{fmtNum(portfolio.sector_affinity.data_quality?.confidence_score)} از ۱۰۰</div></div>
                      <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">پوشش ارزش‌گذاری</div><div className="font-bold num mt-1">{fmtPct(portfolio.sector_affinity.data_quality?.valuation_coverage_pct, 1)}</div></div>
                      <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">پوشش گروه رسمی</div><div className="font-bold num mt-1">{fmtPct(portfolio.sector_affinity.data_quality?.sector_classification_coverage_pct, 1)}</div></div>
                    </div>
                  </div>
                  {portfolio.sector_affinity.status === 'registry_missing' ? (
                    <div className="p-3 text-amber-300 text-[11px]">
                      مرجع گروه‌های رسمی هنوز ساخته نشده است. ابزار tools/sync_instrument_sectors.py را مطابق docs/sector-affinity.md اجرا کنید. تا آن زمان سیستم گروهی را حدس نمی‌زند.

                    <>
                      <div className="p-3 border-b border-[var(--border-subtle)]">

                            </thead>
