                <div className="p-4 text-center text-[var(--text-secondary)]">رویداد افزایش سرمایه‌ای در داده‌های این نماد ثبت نشده است.</div>
              ) : (
                <table className="w-full text-right">
                  <thead className="bg-[var(--bg-elevated)]"><tr><th className="p-2">تاریخ</th><th className="p-2">نوع</th><th className="p-2">سهام قدیم</th><th className="p-2">سهام جدید</th><th className="p-2">نسبت</th><th className="p-2">تأییدیه</th></tr></thead>
                  <tbody>
                    {actions.map((ca, i) => (
                      <tr key={i} className="border-t border-[var(--border-subtle)]">
                        <td className="p-2 num">{fmtDate(ca.event_date_jalali || ca.effective_date_jalali)}</td>
                        <td className="p-2">{ACTION_TYPE_FA[ca.action_type] || ca.action_type}</td>
                        <td className="p-2 num">{fmtNum(ca.old_total_shares)}</td>
                        <td className="p-2 num">{fmtNum(ca.new_total_shares)}</td>
                        <td className="p-2 num">{ca.capital_increase_ratio ?? ca.share_ratio_new_over_old ?? '—'}</td>
                        <td className="p-2">{ca.verification_status}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          )}

          {tab === 'quality' && quality && (
            <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2.5 text-xs">
              {snap.total_shareholder_count_note && (
                <div className="p-2.5 rounded bg-amber-500/10 border border-amber-500/30 text-amber-300">
                  <strong>توضیح تعداد کل سهام‌داران:</strong> {snap.total_shareholder_count_note}
                </div>
              )}
              <div className="font-bold">شکاف‌های داده (`data_gaps`: {toFa(quality.data_gaps.length)})</div>
              {quality.data_gaps.map((g, i) => (
                <div key={i} className="p-2 rounded bg-[var(--bg-elevated)] border border-[var(--border-subtle)]">
                  <strong>{g.field}</strong> ({fmtDate(g.date_from)} تا {fmtDate(g.date_to)}): {g.reason}
                </div>
              ))}
              <div className="font-bold pt-2">گزارش‌های تطبیق (`reconciliation`: {toFa(quality.reconciliation.length)})</div>
              {quality.reconciliation.slice(0, 30).map((r, i) => (
                <div key={i} className="p-2 rounded bg-[var(--bg-elevated)] border border-[var(--border-subtle)] flex justify-between">
                  <span><strong>[{r.category}]</strong> {r.description}</span>
                  <span className="num text-[var(--text-secondary)]">{fmtDate(r.date_jalali)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- 6. Page 3: Cross-Company Shareholder Intelligence ---
    // --- 6. Page 3: Cross-Company Shareholder Intelligence ---
    // One row per PERSON (grouped by the pipeline's own identity links),
    // not per (holder, symbol). Clicking a holder shows their whole
    // portfolio: first the combined value chart (sum of all symbols),
    // then one chart per company; clicking a company swaps the main
    // chart to that company's series.
    function ShareholderIntelligencePage({ currency, theme, onOpenStock, onOpenInvestor, dateMode }) {
      const [q, setQ] = useState('');
      const [symbolFilter, setSymbolFilter] = useState('');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [minPct, setMinPct] = useState('');
      const [multiOnly, setMultiOnly] = useState(false);
      const [rows, setRows] = useState([]);
      const [selected, setSelected] = useState(null);
      const [portfolio, setPortfolio] = useState(null);
      const [histories, setHistories] = useState({});
      const [mainChart, setMainChart] = useState('combined');
      const [loading, setLoading] = useState(false);
      const [offset, setOffset] = useState(0);

      useEffect(() => {
        const timer = setTimeout(() => {
          setLoading(true);
          const qs = new URLSearchParams({
            q, symbol: symbolFilter, shareholder_type: typeFilter,
            multi_company_only: String(multiOnly), limit: '40', offset: String(offset),
          });
          if (minPct !== '') qs.set('min_ownership', minPct);
          apiFetch(`/api/v1/shareholders/search?${qs.toString()}`)
            .then(res => setRows(res.rows || []))
            .finally(() => setLoading(false));
        }, 250);
        return () => clearTimeout(timer);
      }, [q, symbolFilter, typeFilter, minPct, multiOnly, offset]);

      const loadGroup = (group) => {
        setSelected(group);
        setPortfolio(null);
        setHistories({});
        setMainChart('combined');
        apiFetch(`/api/v1/portfolios/${encodeURIComponent(group.group_id)}`)
          .then(res => setPortfolio(res))
          .catch(() => {});
        // One % history per company, using that symbol's own (scheme, id).
        (group.symbols || []).forEach(s => {
          const qs = new URLSearchParams({
            symbol: s.symbol, id_scheme: s.id_scheme,
            shareholder_id: String(s.shareholder_id),
          });
          apiFetch(`/api/v1/shareholders/observation-history?${qs.toString()}`)
            .then(res => setHistories(prev => ({ ...prev, [s.symbol]: res.history || [] })))
            .catch(() => {});
        });
      };

      const combinedSeries = useMemo(() => {
        // Values in همر (1e12 Rial) in IRR mode, همت (1e12 Toman = 1e13 Rial)
        // in IRT mode -- same divisor as the portfolio page.
        const divisor = currency === 'IRT' ? 1e13 : 1e12;
        return (portfolio?.history_series || []).map(p => ({
          time: p.time,
          value: (p.combined_value_rial || 0) / divisor,
        }));
      }, [portfolio, currency]);

      const valuedPositions = portfolio
        ? [...(portfolio.confirmed_positions || []), ...(portfolio.probable_positions || [])]
        : [];
      const totalValue = portfolio
        ? ((portfolio.summary?.confirmed_combined_value_rial || 0)
           + (portfolio.summary?.probable_combined_value_rial || 0))
        : null;
      const totalShares = valuedPositions.reduce((a, p) => a + (p.shares || 0), 0);

      return (
        <div className="space-y-3 text-xs">
          <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] flex flex-wrap justify-between items-center gap-2">
            <div>
              <h1 className="text-sm font-bold">پایگاه جامع سهام‌داران در تمام شرکت‌های واردشده</h1>
              <p className="text-[11px] text-[var(--text-secondary)]">هر سطر یک سهام‌دار است — با همهٔ شرکت‌هایی که در آن‌ها سهام دارد. جستجو بر اساس نام، شناسه TSETMC، نماد، حداقل درصد مالکیت و حضور هم‌زمان در چند شرکت</p>
            </div>
            <div className="flex flex-wrap gap-2 items-center">
              <input value={q} onChange={e => { setQ(e.target.value); setOffset(0); }} placeholder="نام سهام‌دار یا شناسه..." className="px-2.5 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-52" />
              <input value={symbolFilter} onChange={e => { setSymbolFilter(e.target.value); setOffset(0); }} placeholder="نماد..." className="px-2.5 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-24" />
              <input type="number" value={minPct} onChange={e => { setMinPct(e.target.value); setOffset(0); }} placeholder="حداقل ٪" className="px-2 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-24 num" />
              <select value={typeFilter} onChange={e => { setTypeFilter(e.target.value); setOffset(0); }} className="px-2 py-1.5 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)]">
                <option value="ALL">همه</option>
                <option value="individual">حقیقی</option>
                <option value="legal">حقوقی</option>
              </select>
              <label className="flex items-center gap-1 cursor-pointer">
                <input type="checkbox" checked={multiOnly} onChange={e => { setMultiOnly(e.target.checked); setOffset(0); }} />
                <span>فقط سهام‌داران چندشرکتی</span>
              </label>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
            <div className="lg:col-span-7 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-x-auto">
              <table className="w-full text-right">
                <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                  <tr><th className="p-2">نام سهام‌دار</th><th className="p-2">نمادها</th><th className="p-2">شناسه</th><th className="p-2">بیشترین مالکیت٪</th><th className="p-2">آخرین تغییر</th></tr>
                </thead>
                <tbody className="divide-y divide-[var(--border-subtle)]">
                  {loading ? (
                    <tr><td colSpan="5" className="p-6 text-center text-[var(--text-secondary)]">در حال جستجو...</td></tr>
                  ) : rows.map((r, i) => (
                    <tr key={r.group_id} onClick={() => loadGroup(r)} className="cursor-pointer hover:bg-[var(--bg-elevated)]">
                      <td className="p-2 font-semibold">{r.shareholder_name}</td>
                      <td className="p-2">
                        <span className="font-bold text-blue-400">{toFa(r.n_companies)} شرکت</span>
                        <span className="text-[10px] text-[var(--text-secondary)] block">{(r.symbols || []).slice(0, 3).map(s => s.symbol).join('، ')}{(r.symbols || []).length > 3 ? '…' : ''}</span>
                      </td>
                      <td className="p-2 num text-[10px]">{r.shareholder_id}</td>
                      <td className="p-2 num font-semibold">{fmtPct(r.latest_ownership_pct)}</td>
                      <td className={`p-2 num ${r.latest_shares_change > 0 ? 'text-[var(--up)]' : r.latest_shares_change < 0 ? 'text-[var(--down)]' : ''}`}>{fmtNum(r.latest_shares_change)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="p-2 border-t border-[var(--border-subtle)] flex justify-between">
                <button disabled={offset === 0} onClick={() => setOffset(o => Math.max(0, o - 40))} className="px-2 py-1 rounded border border-[var(--border-subtle)] disabled:opacity-40">صفحه قبل</button>
                <button disabled={rows.length < 40} onClick={() => setOffset(o => o + 40)} className="px-2 py-1 rounded border border-[var(--border-subtle)] disabled:opacity-40">صفحه بعد</button>
              </div>
            </div>

            <div className="lg:col-span-5 p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2.5 lg:sticky lg:top-24 self-start">
              {selected ? (
                <>
                  <div className="flex justify-between items-start gap-2">
                    <div>
                      <div className="font-bold text-sm">{selected.shareholder_name}</div>
                      <div className="text-[11px] text-[var(--text-secondary)]">
                        {selected.shareholder_type === 'legal' ? 'حقوقی' : selected.shareholder_type === 'individual' ? 'حقیقی' : ''} | بازه مشاهده: <span className="num">{fmtDate(selected.first_observed_date_jalali)} تا {fmtDate(selected.last_observed_date_jalali)}</span>
                      </div>
                      <div className="mt-1">
                        ارزش سرمایه‌گذاری: <span className="font-bold num">{totalValue !== null ? fmtMoney(totalValue, currency) : '…'}</span>
                        {' '} | تعداد سهام: <span className="font-bold num">{fmtNum(totalShares)}</span>
                        {' '} | شرکت‌ها: <span className="font-bold num">{toFa(selected.n_companies)}</span>
                      </div>
                    </div>
                    <button onClick={() => onOpenInvestor && onOpenInvestor(selected.group_id)} className="px-2 py-1 rounded border border-blue-500/40 text-blue-400 shrink-0">پرتفوی کامل در تب ۴</button>
                  </div>
                  <div>
                    <div className="font-bold mb-1 flex justify-between items-center">
                      <span>{mainChart === 'combined' ? `مجموع ارزش همهٔ نمادها (${currency === 'IRT' ? 'همت' : 'همر'})` : `روند مالکیت — ${mainChart}`}</span>
                      {mainChart !== 'combined' && (
                        <button onClick={() => setMainChart('combined')} className="px-2 py-0.5 rounded border border-[var(--border-subtle)] text-[11px]">بازگشت به مجموع</button>
                      )}
                    </div>
                    <LWChart data={mainChart === 'combined' ? combinedSeries : (histories[mainChart] || [])} height={220} theme={theme} color="#00c853" unitLabel={mainChart === 'combined' ? (currency === 'IRT' ? 'همت' : 'همر') : '٪'} dateMode={dateMode} />
                  </div>
                  {(selected.symbols || []).length > 0 && (
                    <div className="space-y-2">
                      <div className="font-bold">چارت هر شرکت</div>
                      {selected.symbols.map(s => (
                        <div key={s.symbol} onClick={() => setMainChart(s.symbol)} className={`p-2 rounded border cursor-pointer ${mainChart === s.symbol ? 'border-blue-500/60 bg-blue-500/5' : 'border-[var(--border-subtle)]'}`}>
                          <div className="flex justify-between items-center mb-1">
                            <button onClick={(e) => { e.stopPropagation(); onOpenStock(s.symbol); }} className="font-bold text-blue-400 underline">{s.symbol}</button>
                            <span className="num text-[var(--text-secondary)]">{fmtPct(s.latest_ownership_pct)} | {fmtNum(s.shares)} سهم</span>
                          </div>
                          <LWChart data={histories[s.symbol] || []} height={120} theme={theme} color="#00c853" unitLabel="٪" dateMode={dateMode} />
                        </div>
                      ))}
                    </div>
                  )}
                </>
              ) : (
                <div className="p-8 text-center text-[var(--text-secondary)]">یک سطر را برای مشاهده پرتفوی کامل سهام‌دار انتخاب کنید.</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- 7. Page 4: Investor Portfolio Reconstruction ---
    function PortfolioReconstructionPage({ currency, theme, onOpenStock, dateMode, initialInvestor = '' }) {
      const [invQuery, setInvQuery] = useState('');
      const [invSort, setInvSort] = useState('linked');
      const [investors, setInvestors] = useState([]);
      const [selectedId, setSelectedId] = useState('');
      const [idInput, setIdInput] = useState('');
      const [asOfDate, setAsOfDate] = useState('');
      const [portfolio, setPortfolio] = useState(null);
      const [loading, setLoading] = useState(false);
      const [compQuery, setCompQuery] = useState('');
      const [compResults, setCompResults] = useState([]);
      const [compSymbol, setCompSymbol] = useState('');
      const [compHolders, setCompHolders] = useState([]);
      const [compLoading, setCompLoading] = useState(false);
      // Historical observations are fetched only for the selected security,
      // in bounded pages; the full investor ledger is never loaded at once.
      const [historyInsCode, setHistoryInsCode] = useState('');
      const [historyOffset, setHistoryOffset] = useState(0);
      const [historyData, setHistoryData] = useState(null);
      const [historyLoading, setHistoryLoading] = useState(false);
      const HISTORY_PAGE_SIZE = 100;

      // Open a specific investor (e.g. clicked on a holder on the
      // dashboard): the dashboard passes "scheme:id".
      useEffect(() => { if (initialInvestor) setSelectedId(initialInvestor); }, [initialInvestor]);

      // Direct ID entry: "share_id:123456" / "ondate_share_id:123456",
      // or a bare number (treated as share_id).
      const applyIdInput = () => {
        const v = idInput.trim();
        if (!v) return;
        setSelectedId(v.includes(':') ? v : `share_id:${v}`);
      };

      // Find an investor through a company: search the company, pick it,
      // and its shareholders appear below -- click one to load them.
      useEffect(() => {
        if (!compQuery.trim()) { setCompResults([]); return; }
        const timer = setTimeout(() => {
          apiFetch(`/api/v1/stocks/search?q=${encodeURIComponent(compQuery.trim())}&limit=8`)
            .then(res => setCompResults(res.results || []))
            .catch(() => {});
        }, 200);
        return () => clearTimeout(timer);
      }, [compQuery]);

      useEffect(() => {
        if (!compSymbol) { setCompHolders([]); return; }
        setCompLoading(true);
        apiFetch(`/api/v1/stocks/${encodeURIComponent(compSymbol)}/shareholders`)
          .then(res => setCompHolders(res.rows || []))
          .catch(() => setCompHolders([]))
          .finally(() => setCompLoading(false));
      }, [compSymbol]);

      useEffect(() => {
        const timer = setTimeout(() => {
          apiFetch(`/api/v1/portfolios/investors?q=${encodeURIComponent(invQuery)}&limit=30&sort_by=${invSort}`)
            .then(res => {
              const list = res.investors || [];
              setInvestors(list);
              if (!selectedId && list.length > 0) setSelectedId(list[0].id);
            });
        }, 200);
        return () => clearTimeout(timer);
      }, [invQuery, invSort]);

      useEffect(() => {
        if (!selectedId) return;
        setLoading(true);
        const qs = asOfDate ? `?as_of_date=${encodeURIComponent(asOfDate)}` : '';
        apiFetch(`/api/v1/portfolios/${encodeURIComponent(selectedId)}${qs}`)
          .then(setPortfolio)
          .finally(() => setLoading(false));
      }, [selectedId, asOfDate]);

      useEffect(() => {
        setHistoryInsCode('');
        setHistoryOffset(0);
        setHistoryData(null);
      }, [selectedId, asOfDate]);

      useEffect(() => {
        if (!selectedId || !historyInsCode) {
          setHistoryData(null);
          return;
        }
        let active = true;
        setHistoryLoading(true);
        const params = new URLSearchParams({
          ins_code: historyInsCode,
          limit: String(HISTORY_PAGE_SIZE),
          offset: String(historyOffset),
        });
        if (asOfDate) params.set('as_of_date', asOfDate);
        apiFetch(`/api/v1/portfolios/${encodeURIComponent(selectedId)}/history?${params.toString()}`)
          .then(result => { if (active) setHistoryData(result); })
          .catch(() => { if (active) setHistoryData({ rows: [], total: 0, error: true }); })
          .finally(() => { if (active) setHistoryLoading(false); });
        return () => { active = false; };
      }, [selectedId, historyInsCode, historyOffset, asOfDate]);

      const sum = portfolio?.summary || {};
      const chartSeries = useMemo(() => {
        // Values are plotted only for dates with at least one valid disclosed position.
        const divisor = currency === 'IRT' ? 1e13 : 1e12;
        return (portfolio?.history_series || [])
          .filter(p => p.combined_value_rial !== null && p.combined_value_rial !== undefined)
          .map(p => ({ time: p.time, value: p.combined_value_rial / divisor }));
      }, [portfolio, currency]);

      const historyChangeLabel = (row) => ({
        first_observation: 'اولین مشاهده؛ سابقهٔ قبلی موجود نیست',
        net_increase: 'افزایش خالص مشاهده‌شده',
        net_decrease: 'کاهش خالص مشاهده‌شده؛ فروش قطعی نیست',
        not_disclosed: 'در این تاریخ افشا نشده',
        change_after_gap: 'تغییر پس از فاصلهٔ مشاهدات',
        capital_action: 'رویداد سرمایه‌ای',
        identity_conflict: 'تعارض شناسه؛ مقدار نامعتبر',
        observation: 'مشاهدهٔ موجودی',
      })[row.change_classification] || row.change_type || 'نامشخص';

      const historyExitLabel = (item) => ({
        assumed_sold: 'فروش فرضی؛ خروج از فهرست افشا',
        currently_disclosed: 'در آخرین افشا مشاهده شده',
        unknown: 'وضعیت خروج نامشخص',
      })[item.exit_status] || 'وضعیت نامشخص';

      return (
        <div className="portfolio-page space-y-3 text-xs">
          <section className="portfolio-heading">
            <div className="portfolio-eyebrow">تحلیل مالکیت و سوابق سهام‌داری</div>
            <h1>بازسازی پرتفوی سرمایه‌گذاران</h1>
            <p>دارایی‌های مستقیم و پیوندهای هویتی محتمل را جداگانه ببینید، تغییرات هر نماد را در طول زمان بررسی کنید و تاریخ مبنای تحلیل را کنترل کنید.</p>
          </section>
          <section className="portfolio-control-panel">
            <div className="portfolio-panel-heading">
              <div><h2>انتخاب سرمایه‌گذار</h2><p>ابتدا نام یا شناسه را پیدا کنید؛ سپس پرتفوی و دفتر تاریخچه به‌صورت جداگانه نمایش داده می‌شود.</p></div>
              <span className="portfolio-live-tag">هویت‌محور · بدون ادغام نامی</span>
            </div>
            <div className="portfolio-controls-grid">
              <div className="portfolio-field">
                <label htmlFor="portfolio-investor-search">جستجوی سرمایه‌گذار</label>
                <input id="portfolio-investor-search" value={invQuery} onChange={e => setInvQuery(e.target.value)} placeholder="نام یا بخشی از شناسه..." />
              </div>
              <div className="portfolio-field">
                <label htmlFor="portfolio-investor-sort">ترتیب نمایش نتایج</label>
                <select id="portfolio-investor-sort" value={invSort} onChange={e => setInvSort(e.target.value)} title="مرتب‌سازی فهرست سرمایه‌گذاران">
                  <option value="linked">بیشترین رکورد</option><option value="inferred">بیشترین لینک استنتاجی</option>
                </select>
              </div>
              <div className="portfolio-field">
                <label htmlFor="portfolio-investor-select">سرمایه‌گذار انتخاب‌شده</label>
                <select id="portfolio-investor-select" value={selectedId} onChange={e => setSelectedId(e.target.value)}>
                  {investors.map(inv => (
                    <option key={inv.id} value={inv.id}>
                      {inv.canonical_name} ({toFa(inv.verified_links_count)} تأیید / {toFa(inv.inferred_links_count || 0)} استنتاجی / {toFa(inv.linked_records_count)} کل)
                    </option>
                  ))}
                </select>
              </div>
            </div>
            <div className="portfolio-controls-secondary">
              <div className="portfolio-field">
                <label htmlFor="portfolio-direct-id">ورود مستقیم شناسهٔ منبع</label>
                <input id="portfolio-direct-id" value={idInput} onChange={e => setIdInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') applyIdInput(); }} placeholder="مثلاً share_id:123456" className="num" title="شناسهٔ سرمایه‌گذار به شکل scheme:id — عدد خالی یعنی share_id" />
              </div>
              <button onClick={applyIdInput} className="portfolio-apply-button">اعمال شناسه</button>
              <div className="portfolio-field">
                <label htmlFor="portfolio-as-of-date">تاریخ مبنای تحلیل (اختیاری)</label>
                <input id="portfolio-as-of-date" type="date" value={asOfDate} onChange={e => setAsOfDate(e.target.value)} className="num" title="تاریخ میلادی مبنا" />
              </div>
              {asOfDate && <span className="text-[11px] text-[var(--text-secondary)] num" aria-live="polite">{fmtGregorianDate(asOfDate)}</span>}
            </div>
            <p className="portfolio-control-help">توجه: شناسه‌های «تأییدشده» و «استنتاجی» در سامانه یک سطح اطمینان ندارند؛ مقادیر آن‌ها در خلاصهٔ پرتفوی تفکیک شده‌اند.</p>
          </section>

          <section className="portfolio-lookup-panel p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2">
            <div className="font-bold">شروع از روی یک شرکت</div>
            <p className="text-[11px] text-[var(--text-secondary)]">نماد را انتخاب کنید تا فهرست سهام‌داران عمدهٔ آن شرکت نمایش داده شود؛ با انتخاب هر فرد، پرتفوی او باز می‌شود.</p>
            <div className="flex flex-wrap gap-2">

                <div className="flex flex-wrap gap-1.5">
                  {compResults.map(r => (
                    <button key={r.symbol} onClick={() => { setCompSymbol(r.symbol); setCompQuery(r.symbol); setCompResults([]); }} className={`px-2.5 py-1.5 rounded border border-[var(--border-subtle)] ${compSymbol === r.symbol ? 'bg-blue-600 text-white' : 'bg-[var(--bg-elevated)]'}`}>{r.symbol} — {r.company_name}</button>
                  ))}
                </div>
              )}
            </div>
            {compSymbol && (
              <div className="space-y-1">
                <div className="text-[var(--text-secondary)]">سهام‌داران عمدهٔ {compSymbol} — روی یک سهام‌دار کلیک کنید تا پرتفوی او باز شود:</div>
                {compLoading ? (
                  <div className="text-[var(--text-secondary)]">در حال واکشی سهام‌داران...</div>
                ) : compHolders.length === 0 ? (
                  <div className="text-[var(--text-secondary)]">سهام‌داری برای این نماد ثبت نشده است.</div>
                ) : (
                  <div className="max-h-56 overflow-y-auto divide-y divide-[var(--border-subtle)]">
                    {compHolders.map(h => (
                      <div key={`${h.id_scheme}:${h.shareholder_id}`} role="button" tabIndex={0} onClick={() => setSelectedId(`${h.id_scheme}:${h.shareholder_id}`)} onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSelectedId(`${h.id_scheme}:${h.shareholder_id}`); } }} className="py-1.5 flex justify-between gap-2 cursor-pointer hover:text-blue-400">
                        <span className="font-semibold">{h.shareholder_name} <span className="text-[10px] text-[var(--text-secondary)] num">{h.id_scheme}:{h.shareholder_id}</span></span>
                        <span className="num">{fmtNum(h.shares)} سهم ({fmtPct(h.ownership_percent_calculated)})</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </section>

          {loading ? (
            <div className="p-8 text-center text-[var(--text-secondary)]">در حال بازسازی پرتفوی...</div>
          ) : portfolio && (
            <>
              <div className="portfolio-kpis grid grid-cols-1 md:grid-cols-4 gap-2.5">
                <div className="portfolio-kpi portfolio-kpi--primary p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)]">
                  <div className="text-[var(--text-secondary)]">ارزش کل تأییدشده (ترکیبی)</div>
                  <div className="text-base font-bold num text-emerald-400 mt-1">{fmtMoney(sum.confirmed_combined_value_rial, currency)}</div>
                  <div className="text-[10px] text-[var(--text-secondary)] mt-0.5">فاقد قیمت معتبر: {toFa(sum.positions_missing_price_count)} پوزیشن</div>
                </div>
                <div className="portfolio-kpi portfolio-kpi--probable p-3 rounded border border-blue-500/30 bg-blue-500/5">
                  <div className="text-blue-300">ارزش محتمل (تطبیق دقیق استنتاجی)</div>
                  <div className="text-base font-bold num text-blue-400 mt-1">{fmtMoney(sum.probable_combined_value_rial, currency)}</div>
                  <div className="text-[10px] text-[var(--text-secondary)] mt-0.5">شرکت‌های محتمل: {toFa(sum.probable_companies_count)}</div>
                </div>
                <div className="portfolio-kpi portfolio-kpi--uncertain p-3 rounded border border-amber-500/30 bg-amber-500/5">
                  <div className="text-amber-300">کاندیداهای غیرقطعی (مستثنی)</div>
                  <div className="text-base font-bold num mt-1">{toFa(sum.uncertain_candidates_count)}</div>
                </div>
                <div className="portfolio-kpi p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)]">
                  <div className="text-[var(--text-secondary)]">وضعیت سرمایه‌گذار</div>
                  <div className="mt-1"><IdentityBadge status={portfolio.investor.verification_status} /></div>
                </div>
              </div>

              {portfolio.identity_evidence && (
                <section className="portfolio-identity-panel p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-1.5">
                  <div className="font-bold">شواهد و سطح اطمینان هویت</div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1">
                    <div>وضعیت در رجیستری هویت: <IdentityBadge status={portfolio.identity_evidence.registry_identity_status} /></div>
                    <div>نوع سهام‌دار: {portfolio.identity_evidence.shareholder_type === 'legal' ? 'حقوقی' : portfolio.identity_evidence.shareholder_type === 'individual' ? 'حقیقی' : '—'}</div>
                    <div>اولین مشاهده: <span className="num">{fmtDate(portfolio.identity_evidence.first_seen_date_jalali)}</span> — آخرین مشاهده: <span className="num">{fmtDate(portfolio.identity_evidence.last_seen_date_jalali)}</span></div>
                    <div>رکوردهای پیوندخورده: <span className="num">{toFa(portfolio.identity_evidence.linked_records_count)}</span> (تأییدشده: <span className="num">{toFa(portfolio.identity_evidence.verified_links_count)}</span>، استنتاجی: <span className="num">{toFa(portfolio.identity_evidence.inferred_links_count)}</span>)</div>
                    <div>پوزیشن‌ها بر اساس سطح اطمینان — تأییدشده: <span className="num">{toFa(portfolio.identity_evidence.positions_by_tier?.confirmed || 0)}</span>، محتمل: <span className="num">{toFa(portfolio.identity_evidence.positions_by_tier?.probable || 0)}</span>، غیرقطعی: <span className="num">{toFa(portfolio.identity_evidence.positions_by_tier?.uncertain || 0)}</span></div>
                  </div>
                  <div className="text-[11px] text-[var(--text-secondary)]">
                    «تأییدشده» یعنی پوزیشن رکورد مستقیم همین شناسه است (یا منبع خودش هر دو شناسه را در یک ردیف گذاشته است). «محتمل» یعنی پوزیشن زیر یک شناسهٔ دوقلوی استنتاجی است: در همهٔ تاریخ‌ها تاریخ + تعداد سهام + نام دقیقاً یکسان بوده، فقط یک کاندید وجود داشته، هیچ تناقضی در هیچ تاریخی نبوده، و برای اشخاص حقیقیِ بدون نام (شخص حقیقی) حداقل دو تاریخ مستقل هم‌خوانی داشته‌اند؛ نام فقط برای بررسی سازگاری استفاده شده، نه به‌تنهایی. بقیهٔ رکوردها «غیرقطعی» هستند و در هیچ جمعی نمی‌آیند.
                  </div>
                </section>
              )}

              {portfolio.historical_summary && (
                <section className="portfolio-history-panel rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-hidden">
                  <div className="p-3 border-b border-[var(--border-subtle)]">
                    <h3 className="font-bold text-sm">تاریخچهٔ تمام نمادهای مشاهده‌شده</h3>
                    <p className="mt-1 text-[11px] text-[var(--text-secondary)]">
                      این فهرست شامل نمادهایی است که در گذشته برای این هویت ثبت شده‌اند، حتی اگر در آخرین فهرست سهام‌داران دیده نشوند.
                    </p>
                    <p className="portfolio-exit-note mt-2 text-[11px] text-amber-300">
                      راهنمای خروج: اگر پس از آخرین مشاهدهٔ سهام‌دار، snapshot جدیدی از شرکت وجود داشته باشد ولی نام او در فهرست افشاشده نباشد، وضعیت «فروش فرضی» نمایش داده می‌شود. این فرض ممکن است اشتباه باشد؛ سهام‌دار شاید فقط به زیر آستانهٔ افشا رسیده باشد. داده‌های TSETMC به‌تنهایی معاملهٔ فروش را اثبات نمی‌کنند.
                    </p>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-2 p-3">
                    <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">نمادهای تاریخی</div><div className="font-bold text-base num">{toFa(portfolio.historical_summary.symbols_count)}</div></div>
                    <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">کل مشاهدات</div><div className="font-bold text-base num">{toFa(portfolio.historical_summary.observations_count)}</div></div>
                    <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">افزایش/کاهش خالص</div><div className="font-bold text-base num">{toFa(portfolio.historical_summary.change_events_count)}</div></div>
                    <div className="rounded bg-[var(--bg-elevated)] p-2"><div className="text-[10px] text-[var(--text-secondary)]">تعارض هویت</div><div className="font-bold text-base num">{toFa(portfolio.historical_summary.identity_conflicts_count)}</div></div>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-right">
                      <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                        <tr><th className="p-2">نماد</th><th className="p-2">اولین مشاهده</th><th className="p-2">آخرین مشاهده</th><th className="p-2">آخرین تعداد</th><th className="p-2">وضعیت خروج</th><th className="p-2">تعداد رکورد</th></tr>
                      </thead>
                      <tbody className="divide-y divide-[var(--border-subtle)]">
                        {(portfolio.historical_symbols || []).length === 0 ? (
                          <tr><td colSpan="6" className="p-4 text-center text-[var(--text-secondary)]">تاریخچه‌ای برای شناسه‌های معتبر این سرمایه‌گذار پیدا نشد.</td></tr>
                        ) : portfolio.historical_symbols.map(item => (
                          <tr key={item.ins_code} className={historyInsCode === item.ins_code ? 'bg-blue-500/10' : 'hover:bg-[var(--bg-elevated)]'}>
                            <td className="p-2 whitespace-nowrap">
                              <button className="font-bold text-blue-400" onClick={() => { setHistoryInsCode(item.ins_code); setHistoryOffset(0); }}>{item.symbol}</button>
                              <button className="mr-2 text-[10px] text-[var(--text-secondary)] underline" onClick={() => onOpenStock(item.symbol)}>جزئیات نماد</button>
                            </td>
                            <td className="p-2 num whitespace-nowrap">{fmtDate(item.first_observation_date_jalali)}</td>
                            <td className="p-2 num whitespace-nowrap">{fmtDate(item.last_observation_date_jalali)}</td>
                            <td className="p-2 num">{item.last_observation_shares === null ? 'افشا نشده' : fmtNum(item.last_observation_shares)}</td>
                            <td className="p-2 whitespace-nowrap">{historyExitLabel(item)}</td>
                            <td className="p-2 num">{toFa(item.observations_count)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  {historyInsCode && (
                    <div className="border-t border-[var(--border-subtle)]">
                      <div className="p-3 flex flex-wrap justify-between items-center gap-2">
                        <div>
                          <h4 className="font-bold">دفتر تغییرات {portfolio.historical_symbols.find(x => x.ins_code === historyInsCode)?.symbol || ''}</h4>
                          <p className="text-[10px] text-[var(--text-secondary)]">قیمت مرجع است و قیمت اجرای معامله محسوب نمی‌شود.</p>
                        </div>
                        <button className="px-2 py-1 rounded border border-[var(--border-subtle)]" onClick={() => { setHistoryInsCode(''); setHistoryData(null); }}>بستن دفتر</button>
                      </div>
                      {historyLoading ? (
                        <div className="p-5 text-center text-[var(--text-secondary)]">در حال دریافت مشاهدات...</div>
                      ) : historyData?.error ? (
                        <div className="p-5 text-center text-rose-400">دریافت تاریخچه ممکن نشد. بازسازی Sidecar نسخهٔ ۱۰ پس از استقرار کد لازم است.</div>
                      ) : (
                        <>
                          <div className="px-3 pb-2 text-[10px] text-[var(--text-secondary)]">{toFa(historyData?.total || 0)} مشاهده؛ نمایش {toFa(Math.min(historyOffset + 1, historyData?.total || 0))} تا {toFa(Math.min(historyOffset + HISTORY_PAGE_SIZE, historyData?.total || 0))}</div>
                          <div className="overflow-x-auto">
                            <table className="w-full text-right">
                              <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                                <tr><th className="p-2">تاریخ</th><th className="p-2">وضعیت</th><th className="p-2">تعداد قبلی</th><th className="p-2">تعداد مشاهده‌شده</th><th className="p-2">تغییر خالص</th><th className="p-2">قیمت مرجع</th><th className="p-2">ارزش تخمینی</th><th className="p-2">رویداد سرمایه‌ای</th></tr>
                              </thead>
                              <tbody className="divide-y divide-[var(--border-subtle)]">
                                {(historyData?.rows || []).length === 0 ? (
                                  <tr><td colSpan="8" className="p-4 text-center text-[var(--text-secondary)]">رکوردی پیدا نشد.</td></tr>
                                ) : historyData.rows.map((row,index) => (
                                  <tr key={`${row.date}-${index}`} className={row.identity_conflict ? 'bg-amber-500/10' : ''}>
                                    <td className="p-2 num whitespace-nowrap">{fmtDate(row.date_jalali)}</td>
                                    <td className="p-2 whitespace-nowrap">{historyChangeLabel(row)}</td>
                                    <td className="p-2 num">{row.previous_shares === null ? '—' : fmtNum(row.previous_shares)}</td>
                                    <td className="p-2 num">{row.shares === null ? 'افشا نشده/نامعتبر' : fmtNum(row.shares)}</td>
                                    <td className="p-2 num">{row.shares_change === null ? '—' : fmtNum(row.shares_change)}</td>
                                    <td className="p-2 num">{row.reference_price === null ? '—' : fmtNum(currency === 'IRT' ? row.reference_price / 10 : row.reference_price)}</td>
                                    <td className="p-2 num">{row.estimated_holding_value_rial === null ? 'بدون قیمت معتبر' : fmtMoney(row.estimated_holding_value_rial,currency)}</td>
                                    <td className="p-2">{row.corporate_action ? `${row.corporate_action}${row.corporate_action_ratio ? ' (' + row.corporate_action_ratio + ')' : ''}` : '—'}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                          <div className="p-3 border-t border-[var(--border-subtle)] flex items-center justify-between gap-2">
                            <button className="px-3 py-1.5 rounded border border-[var(--border-subtle)] disabled:opacity-40" disabled={historyOffset <= 0 || historyLoading} onClick={() => setHistoryOffset(Math.max(0, historyOffset - HISTORY_PAGE_SIZE))}>صفحهٔ قبل</button>
                            <span className="text-[10px] text-[var(--text-secondary)]">صفحهٔ {toFa(Math.floor(historyOffset / HISTORY_PAGE_SIZE) + 1)}</span>
                            <button className="px-3 py-1.5 rounded border border-[var(--border-subtle)] disabled:opacity-40" disabled={historyOffset + HISTORY_PAGE_SIZE >= (historyData?.total || 0) || historyLoading} onClick={() => setHistoryOffset(historyOffset + HISTORY_PAGE_SIZE)}>صفحهٔ بعد</button>
                          </div>
                        </>
                      )}
                    </div>
                  )}
                </section>
              )}

              <div className="portfolio-chart-panel p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)]">
                <h3 className="font-bold mb-1">ارزش موقعیت‌های افشاشده در تاریخ‌های موجود ({currency === 'IRT' ? 'همت' : 'همر'})</h3>
                <p className="text-[10px] text-[var(--text-secondary)] mb-2">این نمودار فقط تعداد و قیمت معتبر همان تاریخ را جمع می‌کند؛ موجودی روزهای بدون افشا به صفر تبدیل نمی‌شود و از روزهای قبل هم به جلو منتقل نمی‌شود.</p>
                <LWChart data={chartSeries} height={220} theme={theme} color="#2962ff" unitLabel={currency === 'IRT' ? 'همت' : 'همر'} dateMode={dateMode} />
              </div>

              <div className="portfolio-table-panel rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-x-auto">
                <div className="portfolio-table-title p-2.5 border-b border-[var(--border-subtle)] font-bold">پوزیشن‌های مستقیم (رکورد همین شناسه)</div>
                <table className="w-full text-right">
                  <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                    <tr><th className="p-2">نماد</th><th className="p-2">تاریخ مشاهده</th><th className="p-2">تعداد سهام</th><th className="p-2">درصد مالکیت</th><th className="p-2">قیمت</th><th className="p-2">ارزش</th></tr>
                  </thead>
                  <tbody className="divide-y divide-[var(--border-subtle)]">
                    {portfolio.confirmed_positions.length === 0 ? (
                      <tr><td colSpan="6" className="p-4 text-center text-[var(--text-secondary)]">هیچ پوزیشن مستقیمی برای این شناسه ثبت نشده است.</td></tr>
                    ) : portfolio.confirmed_positions.map(p => (
                      <tr key={`${p.symbol}-${p.id_scheme}-${p.shareholder_id}`}>
                        <td className="p-2 font-bold text-blue-400 cursor-pointer" onClick={() => onOpenStock(p.symbol)}>{p.symbol}</td>
                        <td className="p-2 num">{fmtDate(p.observation_date_jalali)}</td>
                        <td className="p-2 num">{fmtNum(p.shares)}</td>
                        <td className="p-2 num">{fmtPct(p.ownership_percent_calculated)}</td>
                        <td className="p-2 num">{p.price ? fmtNum(currency === 'IRT' ? p.price / 10 : p.price) : '—'}</td>
                        <td className="p-2 num font-semibold">{p.holding_value_rial !== null ? fmtMoney(p.holding_value_rial, currency) : 'بدون قیمت معتبر'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="portfolio-table-panel rounded border border-blue-500/30 bg-blue-500/5 overflow-x-auto">
                <div className="portfolio-table-title p-2.5 border-b border-blue-500/30 font-bold text-blue-300">پوزیشن‌های محتمل (تطبیق دقیق استنتاجی — در جمع ارزش لحاظ شده‌اند)</div>
                <table className="w-full text-right">
                  <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                    <tr><th className="p-2">نماد</th><th className="p-2">تاریخ مشاهده</th><th className="p-2">تعداد سهام</th><th className="p-2">درصد مالکیت</th><th className="p-2">قیمت</th><th className="p-2">ارزش</th><th className="p-2">هویت</th></tr>
                  </thead>
                  <tbody className="divide-y divide-[var(--border-subtle)]">
                    {(portfolio.probable_positions || []).length === 0 ? (
                      <tr><td colSpan="7" className="p-4 text-center text-[var(--text-secondary)]">پوزیشن «محتمل»ی برای این سرمایه‌گذار ثبت نشده است.</td></tr>
                    ) : portfolio.probable_positions.map(p => (
                      <tr key={`${p.symbol}-${p.id_scheme}-${p.shareholder_id}`}>
                        <td className="p-2 font-bold text-blue-400 cursor-pointer" onClick={() => onOpenStock(p.symbol)}>{p.symbol}</td>
                        <td className="p-2 num">{fmtDate(p.observation_date_jalali)}</td>
                        <td className="p-2 num">{fmtNum(p.shares)}</td>
                        <td className="p-2 num">{fmtPct(p.ownership_percent_calculated)}</td>
                        <td className="p-2 num">{p.price ? fmtNum(currency === 'IRT' ? p.price / 10 : p.price) : '—'}</td>
                        <td className="p-2 num font-semibold">{p.holding_value_rial !== null ? fmtMoney(p.holding_value_rial, currency) : 'بدون قیمت معتبر'}</td>
                        <td className="p-2"><IdentityBadge status={p.identity_status} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {portfolio.uncertain_candidates.length > 0 && (
                <div className="portfolio-uncertain-panel rounded border border-amber-500/40 bg-amber-500/5 p-3 space-y-1.5">
                  <div className="font-bold text-amber-300">رکوردهای سهام‌داری غیرقطعی (محاسبه‌نشده در جمع کل)</div>
                  {portfolio.uncertain_candidates.map((u, i) => (
                    <div key={i} className="p-2 rounded bg-[var(--bg-panel)] border border-[var(--border-subtle)] flex justify-between">
                      <span>نماد: <strong className="text-blue-400 cursor-pointer" onClick={() => onOpenStock(u.symbol)}>{u.symbol}</strong> ({u.id_scheme}: {u.shareholder_id})</span>
                      <span className="num">سهام: {fmtNum(u.shares)}</span>
                    </div>
                  ))}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    // --- 8. Page 5: Multi-Stock Screener (All Supported Columns) ---
    // Enum fields get a SELECT (op fixed to '='); dates get a date input;
    // numbers get a number input. The real vocabularies come from the
    // pipeline (identity_status, data_completeness, entry_status).
    const SCREENER_ENUMS = {
      shareholder_type: [['legal', 'حقوقی'], ['individual', 'حقیقی']],
      market: [['TSE', 'بورس (TSE)'], ['IFB', 'فرابورس (IFB)'], ['UNKNOWN', 'تعیین‌نشده']],
      change_type: [['new', 'جدید'], ['increase', 'افزایش'], ['decrease', 'کاهش'], ['unchanged', 'بدون تغییر'], ['unknown', 'نامشخص']],
      entry_status: [['first_observed_unconfirmed', 'اولین مشاهده (تأییدنشده)'], ['reappeared_after_not_disclosed', 'بازگشت پس از عدم افشا']],
      identity_status: [
        ['verified_same_source_row', 'تأییدشده (هم‌ردیف منبع)'],
        ['inferred_exact_match', 'تطبیق دقیق استنتاجی'],
        ['unlinked_record_id', 'شناسه منفرد (تأییدنشده)'],
        ['ambiguous_not_linked', 'مبهم / پیوند نشده'],
        ['source_id', 'بدون اطلاعات پیوند (منبع)'],
      ],
      data_completeness: [
        ['complete_by_reported_percent', 'کامل (بر اساس درصد گزارش‌شده)'],
        ['partial_major_holders_only', 'فقط سهام‌داران عمده'],
        ['inconsistent_sum_over_100_percent', 'جمع مالکیت بیش از ۱۰۰٪'],
        ['no_holder_observations', 'بدون مشاهده سهام‌دار'],
        ['holders_only_total_shares_unavailable', 'بدون کل سهام شرکت'],
      ],
    };
    const SCREENER_FIELDS = [
      ['ownership_percent_calculated', 'درصد مالکیت', 'number'],
      ['disclosed_shareholder_count', 'تعداد سهام‌دار عمده', 'number'],
      ['disclosed_ownership_percent_sum', 'تمرکز مالکیت عمده٪', 'number'],
      ['shares_change', 'تغییر سهام', 'number'],
      ['change_type', 'نوع تغییر', 'enum'],
      ['entry_status', 'وضعیت ورود', 'enum'],
      ['shareholder_type', 'نوع سهام‌دار', 'enum'],
      ['identity_status', 'وضعیت احراز هویت', 'enum'],
      ['data_completeness', 'تکمیل بودن داده', 'enum'],
      ['market', 'بازار', 'enum'],
      ['has_corporate_action', 'تعداد افزایش سرمایه', 'number'],
      ['date_gregorian', 'تاریخ میلادی (YYYY-MM-DD)', 'date'],
    ];
    function ScreenerPage({ onOpenStock }) {
      const [logic, setLogic] = useState('AND');
      const [conds, setConds] = useState([
        { field: 'ownership_percent_calculated', op: '>=', value: 5 },
      ]);
      const [sortBy, setSortBy] = useState('ownership_percent_calculated');
      const [results, setResults] = useState([]);
      const [saved, setSaved] = useState([]);
      const [saveName, setSaveName] = useState('');
      const [loading, setLoading] = useState(false);

      const runQuery = useCallback(() => {
        setLoading(true);
        apiFetch('/api/v1/screener/query', {
          method: 'POST',
          body: JSON.stringify({ logic, conditions: conds, sort_by: sortBy, sort_dir: 'DESC', limit: 100 }),
        })
          .then(res => setResults(res.rows || []))
          .finally(() => setLoading(false));
      }, [logic, conds, sortBy]);

      useEffect(() => {
        runQuery();
        apiFetch('/api/v1/screener/saved-filters').then(res => setSaved(res.filters || [])).catch(() => {});
      }, []);

      const saveCurrent = () => {
        if (!saveName.trim()) return;
        apiFetch('/api/v1/screener/saved-filters', {
          method: 'POST',
          body: JSON.stringify({ name: saveName.trim(), filter_ast: { logic, conditions: conds, sort_by: sortBy, sort_dir: 'DESC' } }),
        }).then(() => {
          setSaveName('');
          apiFetch('/api/v1/screener/saved-filters').then(res => setSaved(res.filters || []));
        });
      };

      const exportCsv = () => {
        fetch(`${API_BASE}/api/v1/screener/export`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ logic, conditions: conds, sort_by: sortBy, sort_dir: 'DESC' }),
        })
          .then(r => r.blob())
          .then(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'tsetmc_screener.csv'; a.click();
            URL.revokeObjectURL(url);
          });
      };

      return (
        <div className="space-y-3 text-xs">
          <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] space-y-2.5">
            <div className="flex flex-wrap justify-between items-center gap-2">
              <h1 className="text-sm font-bold">فیلتر پیشرفته روی کل نمادها</h1>
              <div className="flex flex-wrap gap-2">
                <select value={logic} onChange={e => setLogic(e.target.value)} className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] font-bold">
                  <option value="AND">AND (همه شرط‌ها)</option>
                  <option value="OR">OR (حداقل یک شرط)</option>
                </select>
                <button onClick={() => setConds(p => [...p, { field: 'shareholder_type', op: '=', value: 'legal' }])} className="px-2.5 py-1 rounded bg-[var(--bg-elevated)] border border-[var(--border-subtle)]">+ شرط</button>
                <button onClick={runQuery} className="px-3 py-1 rounded bg-blue-600 text-white font-semibold">اجرای فیلتر</button>
                <button onClick={exportCsv} className="px-2.5 py-1 rounded border border-[var(--border-subtle)] bg-[var(--bg-elevated)]">خروجی CSV</button>
              </div>
            </div>

            {conds.map((c, idx) => {
              const fieldMeta = SCREENER_FIELDS.find(f => f[0] === c.field) || SCREENER_FIELDS[0];
              const kind = fieldMeta[2];
              const enumOptions = SCREENER_ENUMS[c.field];
              const setCond = (patch) => setConds(p => p.map((x, i) => i === idx ? { ...x, ...patch } : x));
              return (
              <div key={idx} className="flex flex-wrap gap-2 items-center p-2 rounded bg-[var(--bg-elevated)]">
                <select value={c.field} onChange={e => {
                  const nf = e.target.value;
                  const nk = (SCREENER_FIELDS.find(f => f[0] === nf) || [])[2];
                  if (nk === 'enum') setCond({ field: nf, op: '=', value: (SCREENER_ENUMS[nf] || [['', '']])[0][0] });
                  else setCond({ field: nf, op: '>=', value: '' });
                }} className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)]">
                  {SCREENER_FIELDS.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
                </select>
                {kind === 'enum' ? (
                  <span className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] text-[var(--text-secondary)]">=</span>
                ) : (
                  <select value={c.op} onChange={e => setCond({ op: e.target.value })} className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)]">
                    <option value=">=">&gt;=</option>
                    <option value="<=">&lt;=</option>
                    <option value="=">=</option>
                    <option value=">">&gt;</option>
                    <option value="<">&lt;</option>
                  </select>
                )}
                {kind === 'enum' ? (
                  <select value={c.value} onChange={e => setCond({ value: e.target.value })} className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-64">
                    {(enumOptions || []).map(([v, label]) => <option key={v} value={v}>{label}</option>)}
                  </select>
                ) : kind === 'date' ? (
                  <input type="date" value={c.value || ''} onChange={e => setCond({ value: e.target.value })} className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-40 num" />
                ) : (
                  <input type="number" value={c.value} onChange={e => {
                    const v = e.target.value;
                    setCond({ value: v === '' ? '' : Number(v) });
                  }} className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-40 num" placeholder="عدد..." />
                )}
                <button onClick={() => setConds(p => p.filter((_, i) => i !== idx))} className="text-red-400">حذف</button>
              </div>
              );
            })}

            <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-[var(--border-subtle)]">
              <input value={saveName} onChange={e => setSaveName(e.target.value)} placeholder="نام فیلتر..." className="px-2 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)]" />
              <button onClick={saveCurrent} className="px-2.5 py-1 rounded bg-emerald-600 text-white">ذخیره در دیتابیس</button>
              {saved.map(sf => (
                <button key={sf.id} onClick={() => {
                  const ast = JSON.parse(sf.filter_ast_json);
                  setLogic(ast.logic); setConds(ast.conditions);
                }} className="px-2 py-0.5 rounded bg-[var(--bg-elevated)] border border-[var(--border-subtle)]">{sf.name}</button>
              ))}
            </div>
          </div>

          <div className="rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-x-auto">
            <table className="w-full text-right">
              <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                <tr><th className="p-2">نماد</th><th className="p-2">بازار</th><th className="p-2">سهام‌دار</th><th className="p-2">درصد مالکیت</th><th className="p-2">تغییر سهام</th><th className="p-2">تمرکز شرکت٪</th></tr>
              </thead>
              <tbody className="divide-y divide-[var(--border-subtle)]">
                {loading ? <tr><td colSpan="6" className="p-6 text-center">در حال اجرای فیلتر...</td></tr> : results.map((r, i) => (
                  <tr key={i} onClick={() => onOpenStock(r.symbol)} className="hover:bg-[var(--bg-elevated)] cursor-pointer">
                    <td className="p-2 font-bold text-blue-400">{r.symbol}</td>
                    <td className="p-2">{r.market}</td>
                    <td className="p-2">{r.shareholder_name}</td>
                    <td className="p-2 num font-semibold">{fmtPct(r.ownership_percent_calculated)}</td>
                    <td className="p-2 num">{fmtNum(r.shares_change)}</td>
                    <td className="p-2 num">{fmtPct(r.disclosed_ownership_percent_sum)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- 9. Page 6: Persistent Watchlist with Autocomplete & Sorting ---
    function WatchlistPage({ onOpenStock, currency }) {
      const [items, setItems] = useState([]);
      const [symInput, setSymInput] = useState('');
      const [suggestions, setSuggestions] = useState([]);
      const [sortCol, setSortCol] = useState('disclosed_ownership_percent_sum');
      const [sortAsc, setSortAsc] = useState(false);
      const [err, setErr] = useState('');
      const [msg, setMsg] = useState('');

      const load = () => apiFetch('/api/v1/watchlists/default').then(res => setItems(res.items || []));
      useEffect(() => { load(); }, []);

      useEffect(() => {
        if (!symInput.trim()) { setSuggestions([]); return; }
        const t = setTimeout(() => {
          apiFetch(`/api/v1/stocks/search?q=${encodeURIComponent(symInput.trim())}&limit=8`)
            .then(r => setSuggestions(r.results || []))
            .catch(() => setSuggestions([]));
        }, 200);
        return () => clearTimeout(t);
      }, [symInput]);

      const addSym = (targetSym) => {
        const sym = (targetSym || symInput).trim();
        if (!sym) { setErr('نمادی وارد نشده است.'); setMsg(''); return; }
        apiFetch('/api/v1/watchlists/default/symbols', { method: 'POST', body: JSON.stringify({ symbol: sym }) })
          .then(() => { setSymInput(''); setSuggestions([]); setErr(''); setMsg(`نماد ${sym} به دیده‌بان اضافه شد.`); load(); })
          .catch(e => { setErr(e.message); setMsg(''); });
      };

      const removeSym = (sym) => {
        apiFetch(`/api/v1/watchlists/default/symbols/${encodeURIComponent(sym)}`, { method: 'DELETE' }).then(load);
      };

      const sortedItems = useMemo(() => {
        return [...items].sort((a, b) => {
          const va = a[sortCol] ?? 0, vb = b[sortCol] ?? 0;
          if (typeof va === 'string') return sortAsc ? va.localeCompare(vb, 'fa') : vb.localeCompare(va, 'fa');
          return sortAsc ? va - vb : vb - va;
        });
      }, [items, sortCol, sortAsc]);

      const toggleSort = (col) => {
        if (sortCol === col) setSortAsc(!sortAsc);
        else { setSortCol(col); setSortAsc(false); }
      };

      return (
        <div className="space-y-3 text-xs">
          <ErrorBox error={err} />
          {msg && <div className="p-2.5 rounded border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 text-xs">{msg}</div>}
          <div className="p-3 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] flex flex-wrap justify-between items-center gap-2">
            <h1 className="text-sm font-bold">دیده‌بان شخصی (ذخیره‌شده در SQLite)</h1>
            <div className="flex gap-2 relative">
              <input value={symInput} onChange={e => { setSymInput(e.target.value); setMsg(''); }} onKeyDown={e => { if (e.key === 'Enter') addSym(); }} placeholder="جستجو و افزودن نماد... (Enter)" className="px-2.5 py-1 rounded bg-[var(--bg-canvas)] border border-[var(--border-subtle)] w-56" />
              <button onClick={() => addSym()} className="px-3 py-1 rounded bg-blue-600 text-white">+ افزودن</button>
              {suggestions.length > 0 && (
                <div className="absolute right-0 top-9 w-64 rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] shadow-xl z-40">
                  {suggestions.map(s => (
                    <button key={s.symbol} onClick={() => addSym(s.symbol)} className="w-full text-right p-2 hover:bg-[var(--bg-elevated)] flex justify-between">
                      <span className="font-bold text-blue-400">{s.symbol}</span>
                      <span className="text-[var(--text-secondary)] truncate">{s.company_name || s.market}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>
          <div className="rounded border border-[var(--border-subtle)] bg-[var(--bg-panel)] overflow-x-auto">
            <table className="w-full text-right">
              <thead className="bg-[var(--bg-elevated)] text-[var(--text-secondary)]">
                <tr>
                  <th className="p-2 cursor-pointer" onClick={() => toggleSort('symbol')}>نماد ⇅</th>
                  <th className="p-2">نام شرکت</th>
                  <th className="p-2">بازار</th>
                  <th className="p-2 cursor-pointer" onClick={() => toggleSort('disclosed_shareholder_count')}>تعداد عمده ⇅</th>
                  <th className="p-2 cursor-pointer" onClick={() => toggleSort('disclosed_ownership_percent_sum')}>مالکیت عمده٪ ⇅</th>
                  <th className="p-2 cursor-pointer" onClick={() => toggleSort('market_value')}>ارزش بازار ⇅</th>
                  <th className="p-2">حذف</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[var(--border-subtle)]">
                {sortedItems.map(s => (
                  <tr key={s.symbol}>
                    <td className="p-2 font-bold text-blue-400 cursor-pointer" onClick={() => onOpenStock(s.symbol)}>{s.symbol}</td>
                    <td className="p-2">{s.company_name || '—'}</td>
                    <td className="p-2">{s.market}</td>
                    <td className="p-2 num">{toFa(s.resolved_shareholder_count)}{s.resolved_status === 'review' ? <span className="text-amber-400" title={s.resolved_status_note || 'رکوردهای تکراری حل‌نشده دارد'}> ⚠</span> : ''}</td>
                    <td className="p-2 num" title={s.resolved_status === 'review' ? s.resolved_status_note : undefined}>{fmtPct(s.resolved_ownership_percent_sum)}</td>
                    <td className="p-2 num">{s.market_value !== null && s.market_value !== undefined ? fmtMoney(s.market_value, currency) : '—'}</td>
                    <td className="p-2"><button onClick={() => removeSym(s.symbol)} className="text-red-400">حذف</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }
