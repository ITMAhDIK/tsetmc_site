name: Production readiness

on:
  pull_request:
  push:
    branches:
      - "refactor/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile application and operations code
        run: python -m compileall -q server.py site_api saas_core tools
      - name: Run complete test suite
        run: python -m pytest -q

  postgres-migrations-backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tloomberg_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tloomberg_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAAS_DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/tloomberg_saas
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply SaaS migrations in order
        run: |
          export PGDATABASE="$SAAS_DATABASE_URL"
          for migration in saas_core/schema/001_initial.sql saas_core/schema/002_product_features_referrals_analytics.sql saas_core/schema/003_product_analytics_ingestion.sql saas_core/schema/004_admin_console.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Check SaaS database readiness
        run: python tools/saas_healthcheck.py
      - name: Backup, verify and restore into isolated scratch database
        run: |
          backup_file="$(python tools/saas_db_ops.py backup --directory "$RUNNER_TEMP/saas-backups")"
          python tools/saas_db_ops.py verify --file "$backup_file"
          createdb tloomberg_saas_restore_test
          restore_url="postgresql://postgres:ci_only_password@localhost:5432/tloomberg_saas_restore_test"
          SAAS_DATABASE_URL="$restore_url" python tools/saas_db_ops.py restore --file "$backup_file" --confirm-restore RESTORE_SAAS_DATABASE
          SAAS_DATABASE_URL="$restore_url" python tools/saas_healthcheck.py
          restored_plans="$(PGDATABASE="$restore_url" psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM plans')"
          test "$restored_plans" = "3"
