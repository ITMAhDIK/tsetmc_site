name: CRM Service
on:
  push:
    branches:
      - refactor/architecture-stabilization-phase0
  pull_request:
    branches:
      - main
    paths:
      - "crm_service/**"
      - "scripts/manage_crm_migrations.py"
      - "scripts/migrate_legacy_crm.py"
      - "Dockerfile.crm"
      - "docker-compose.saas*.yml"
      - "Caddyfile.saas"
      - "tests/crm_service/**"
jobs:
  crm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tloomberg_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tloomberg_crm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CRM_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tloomberg_crm_test
      CRM_EXPECTED_DATABASE_NAME: tloomberg_crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-saas.txt
      - name: Apply and verify isolated CRM schema
        run: |
          python scripts/manage_crm_migrations.py --apply
          python scripts/manage_crm_migrations.py --check
      - name: Run CRM unit, API contract and architecture tests
        run: python -m pytest -q tests/crm_service
      - name: Validate local and production Compose
        run: |
          cp .env.saas.example .env.saas
          docker compose --env-file .env.saas.example -f docker-compose.saas.yml config --quiet
          docker compose --env-file .env.saas.example -f docker-compose.saas.production.yml config --quiet
