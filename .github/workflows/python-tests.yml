name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/architecture-stabilization-phase0

concurrency:
  group: python-tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tloomberg_saas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tloomberg_saas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SAAS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tloomberg_saas_test
      SAAS_TEST_DATABASE_NAME: tloomberg_saas_test
      SAAS_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tloomberg_saas_test
      SAAS_EXPECTED_DATABASE_NAME: tloomberg_saas_test
      IDENTITY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tloomberg_identity_test
      IDENTITY_TEST_DATABASE_NAME: tloomberg_identity_test
      IDENTITY_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tloomberg_identity_test
      IDENTITY_EXPECTED_DATABASE_NAME: tloomberg_identity_test
      COMMERCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tloomberg_commerce_test
      COMMERCE_TEST_DATABASE_NAME: tloomberg_commerce_test
      COMMERCE_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tloomberg_commerce_test
      COMMERCE_EXPECTED_DATABASE_NAME: tloomberg_commerce_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install SaaS test dependencies
        run: python -m pip install -r requirements-saas.txt
      - name: Validate and test the frontend analytics SDK
        run: |
          node --check docs/analytics-config.js
          node --check docs/analytics.js
          node --test tests/pages/analytics.test.cjs tests/pages/saas_pages.test.cjs
      - name: Apply all SaaS migrations with checksums and lock
        run: python scripts/manage_saas_migrations.py --apply
      - name: Verify migration history is current
        run: python scripts/manage_saas_migrations.py --check
      - name: Create separate disposable Identity database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@127.0.0.1:5432/postgres", autocommit=True) as conn:
              conn.execute("CREATE DATABASE tloomberg_identity_test")
          PY
      - name: Apply and verify independent Identity migrations
        run: |
          python scripts/manage_identity_migrations.py --apply
          python scripts/manage_identity_migrations.py --check
      - name: Create separate disposable Commerce database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@127.0.0.1:5432/postgres", autocommit=True) as conn:
              conn.execute("CREATE DATABASE tloomberg_commerce_test")
          PY
      - name: Apply and verify independent Commerce migrations
        run: |
          python scripts/manage_commerce_migrations.py --apply
          python scripts/manage_commerce_migrations.py --check
      - name: Run Commerce service PostgreSQL/API tests
        run: python -m pytest -q tests/commerce
      - name: Run Identity service PostgreSQL/API tests
        run: python -m pytest -q tests/identity/test_identity_service.py
      - name: Run focused Phase 9 readiness and cross-platform integration tests
        run: |
          python -m pytest -q \
            tests/saas/test_phase9_load_probe.py \
            tests/saas/test_phase9_security_baseline.py \
            tests/test_portfolio_service.py::test_phase_9_cross_platform_end_to_end_smoke \
            tests/saas/test_crm_phase10.py \
            tests/saas/test_crm_phase10_postgres.py \
            tests/test_portfolio_service.py::test_phase_10_crm_runs_alongside_market_without_cross_database_access
      - name: Run complete test suite (including PostgreSQL integration tests)
        run: python -m pytest -q
