name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SaaS test dependencies
        run: python -m pip install -r requirements-saas.txt
      - name: Run test suite
        run: python -m pytest -q
