name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "refactor/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tloomberg_saas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tloomberg_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAAS_TEST_DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/tloomberg_saas
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: tloomberg_saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner and PostgreSQL driver
        run: python -m pip install --upgrade pytest "psycopg[binary]>=3.2,<4"
      - name: Apply SaaS schema for integration tests
        run: |
          for migration in \
            saas_core/schema/001_initial.sql \
            saas_core/schema/002_product_features_referrals_analytics.sql \
            saas_core/schema/003_product_analytics_ingestion.sql \
            saas_core/schema/004_admin_console.sql \
            saas_core/schema/005_admin_console_security.sql; do
            PGPASSWORD="$PGPASSWORD" psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run unit and integration test suite
        run: python -m pytest -q
