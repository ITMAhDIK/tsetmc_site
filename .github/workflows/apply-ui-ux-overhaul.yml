name: Apply UI UX overhaul
on:
  push:
    branches:
      - chore/apply-ui-ux-overhaul
    paths:
      - ".github/workflows/apply-ui-ux-overhaul.yml"
      - "ui-ux-overhaul.patch.gz.b64"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact supplied patch
        run: |
          git fetch origin chore/apply-ui-ux-overhaul
          git show FETCH_HEAD:ui-ux-overhaul.patch.gz.b64 | base64 -d | gzip -d > /tmp/ui-ux-overhaul.patch
          git apply --check /tmp/ui-ux-overhaul.patch
          git apply /tmp/ui-ux-overhaul.patch
          git diff --check
          python - <<'PY'
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          css = Path("docs/ui-refresh.css").read_text(encoding="utf-8")
          required = ("const SortTh", "const SkeletonRows", "const EmptyState", "aria-sort", "app-drawer-panel")
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Missing UI overhaul features: {missing}")
          if ".th-sort" not in css or ".skeleton-row" not in css:
              raise SystemExit("UI refresh CSS additions are missing")
          print("UI overhaul content checks passed")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/ui-refresh.css
          git commit -m "Apply preferred Tloomberg UI UX overhaul"
          git push origin HEAD:main
