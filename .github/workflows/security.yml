      - name: Verify restored Analytics schema boundary
        run: |
          psql "postgresql://postgres@127.0.0.1:5432/tloomberg_analytics_restore_verify" \
            -X -v ON_ERROR_STOP=1 -c "DO \$\$ DECLARE c BIGINT; h BIGINT; e BIGINT; a BIGINT; l BIGINT; BEGIN SELECT count(*) INTO c FROM analytics_consents; SELECT count(*) INTO h FROM analytics_consent_history; SELECT count(*) INTO e FROM analytics_events; SELECT count(*) INTO a FROM analytics_audit_logs; SELECT count(*) INTO l FROM analytics_ingestion_limits; IF c <> 1 OR h <> 1 OR e <> 1 OR a <> 1 OR l <> 1 THEN RAISE EXCEPTION 'Analytics backup restore counts: consents=%, history=%, events=%, audit=%, limits=%', c,h,e,a,l; END IF; END \$\$"
