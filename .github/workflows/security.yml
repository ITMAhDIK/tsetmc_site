          fi
          grep -F "sslmode=verify-full" "$RUNNER_TEMP/analytics-restore-tls-negative.log"
      - name: Restore Analytics backup into an isolated database
        run: |
          createdb --host=127.0.0.1 --username=postgres tloomberg_analytics_restore_verify
          dump_file="$(find "$RUNNER_TEMP/analytics-backups" -maxdepth 1 -type f -name '*.dump.age' -print -quit)"
          test -n "$dump_file"
          ANALYTICS_BACKUP_FILE="$dump_file" \
