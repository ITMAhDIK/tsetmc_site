        run: |
          if bash scripts/analytics_db_backup.sh >"$RUNNER_TEMP/analytics-backup-tls-negative.log" 2>&1; then
            echo "Analytics backup script accepted a remote connection without verify-full" >&2
            exit 1
          fi
          grep -F "sslmode=verify-full" "$RUNNER_TEMP/analytics-backup-tls-negative.log"
