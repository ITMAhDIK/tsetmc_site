name: Deploy investor history and affinity preview to GitHub Pages

on:
  push:
    branches:
      - preview/investor-history-affinity
      - main
    paths:
      - "docs/**"
      - "saas_core/**"
      - "tests/saas/**"
      - "ui-refresh.css"
      - ".github/workflows/pages-investor-preview.yml"
      - "tools/inspect_pages_workbooks.py"
      - "tools/build_static_investor_demo.py"
      - "tools/audit_manjiil_identity.py"
      - "sector_affinity.py"
      - "docs/investor-preview.html"
      - "docs/data/instrument_sectors.json"
      - "docs/data/dashboard_sector_categories.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-investor-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout investor preview branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check openpyxl pytest

      - name: Test SaaS wallet and schema contracts
        run: python -m pytest tests/saas -q

      - name: Inspect uploaded workbook schemas
        run: python tools/inspect_pages_workbooks.py

      - name: Audit repeated Manjil shareholder IDs
        run: python tools/audit_manjiil_identity.py

      - name: Validate investor preview JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("docs/investor-preview.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline script, found {len(scripts)}")
          Path("/tmp/investor-preview.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/investor-preview.js

      - name: Build static investor history and affinity data
        run: python tools/build_static_investor_demo.py

      - name: Validate login demo, shareholder screener merge and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          auth = Path("docs/saas/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", auth, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one auth script, got {len(scripts)}")
          script = scripts[0]
          if "+989306311461" in auth:
              raise SystemExit("The owner phone must not appear in public source")
          if "DEMO_OTP_MODE = !API_BASE" not in script or 'maxlength="4"' not in auth:
              raise SystemExit("Four-digit no-SMS demo mode is not configured")
          if "setDemoMenuCookie(role)" not in script or "tloomberg_demo_menu=" not in script:
              raise SystemExit("Demo sign-in does not persist the dashboard menu display state")
          if "localStorage" in script or "sessionStorage" in script:
              raise SystemExit("Auth sessions must not be stored in browser storage")
          for required in ("/api/v1/auth/otp/request", "/api/v1/auth/otp/verify",
                           "/api/v1/auth/me", "/api/v1/auth/logout"):
              if required not in script:
                  raise SystemExit(f"Missing live API contract: {required}")
          Path("/tmp/tloomberg-auth.js").write_text(script, encoding="utf-8")

          page = Path("docs/index.html").read_text(encoding="utf-8")
          for required in ("tloomberg_demo_menu=", "setMenuOpen", "demoMenuRole ? 'منو' : 'ورود'",
                           "AccountMenuDrawer", "app-drawer-panel", "خرید اشتراک ویژه",
                           "تاریخچهٔ کیف پول", "مدیریت داده‌های بازار", "ChartAccessContext",
                           "۲٬۴۹۹٬۰۰۰", "۸۹۹٬۰۰۰", "اسنپ‌پی", "دیجی‌پی", "logoutDemoMenu"):
              if required not in page:
                  raise SystemExit(f"Missing account menu behavior: {required}")
          if 'className="app-toolbar"' in page or 'app-tool-button' in page:
              raise SystemExit("Old standalone display settings remain in the top bar")
          css = Path("docs/ui-refresh.css").read_text(encoding="utf-8")
          if ".app-drawer-panel" not in css or ".app-drawer-backdrop" not in css or ".app-premium-chart-lock" not in css:
              raise SystemExit("Right-side account drawer or premium chart lock styles are missing")
          nav = re.search(r"const NAV_PAGES = \[(.*?)\];", page, flags=re.S)
          if not nav:
              raise SystemExit("Main navigation definition not found")
          ids = re.findall(r"\{ id: '([^']+)', label:", nav.group(1))
          expected = ['market', 'stock', 'shareholders', 'portfolio', 'investor-history', 'account']
          if ids != expected:
              raise SystemExit(f"Unexpected main tab order: {ids}")
          share_start = page.index("function ShareholderIntelligencePage")
          share_end = page.index("function PortfolioReconstructionPage", share_start)
          if "<AdvancedScreenerPanel onOpenStock={onOpenStock} />" not in page[share_start:share_end]:
              raise SystemExit("Advanced screener is not embedded in Shareholder Analysis")
          if "{ id: 'screener'" in page:
              raise SystemExit("Old standalone screener tab still exists")
          css = Path("ui-refresh.css").read_text(encoding="utf-8")
          if "justify-content:center" not in css:
              raise SystemExit("Primary navigation is not centered")
          PY
          node --check /tmp/tloomberg-auth.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static investor preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
