name: Deploy investor history and affinity preview to GitHub Pages

on:
  push:
    branches:
      - preview/investor-history-affinity
    paths:
      - "docs/**"
      - ".github/workflows/pages-investor-preview.yml"
      - "tools/inspect_pages_workbooks.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-investor-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout investor preview branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Inspect uploaded workbook schemas
        run: python tools/inspect_pages_workbooks.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static investor preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages-investor-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
