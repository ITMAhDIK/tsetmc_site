services:
  market-initial-refresh:
    image: ${MARKET_API_IMAGE:?Set an immutable market API image reference}
    command:
      - python
      - -m
      - site_api.refresh_worker
      - --db
      - /data/source/market.sqlite
      - --sidecar
      - /var/lib/tloomberg/site_data.sqlite
      - --run-once
    environment:
      MARKET_PUBLIC_READ_ONLY: "true"
      MARKET_ALLOWED_ORIGINS: ${MARKET_ALLOWED_ORIGINS:?Set explicit HTTPS frontend origins}
    volumes:
      - ${MARKET_SOURCE_DB_PATH:?Set the source holdings database file}:/data/source/market.sqlite:ro
      - market_sidecar:/var/lib/tloomberg
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - market-backend

  market-api:
    image: ${MARKET_API_IMAGE:?Set an immutable market API image reference}
    command:
      - python
      - server.py
      - --db
      - /data/source/market.sqlite
      - --port
      - "8000"
      - --host
      - 0.0.0.0
      - --site-dir
      - /app/docs
      - --output-dir
      - /app/output
      - --sidecar
      - /var/lib/tloomberg/site_data.sqlite
      - --refresh-mode
      - external
      - --refresh-minutes
      - "10"
    environment:
      MARKET_PUBLIC_READ_ONLY: "true"
      MARKET_ALLOWED_ORIGINS: ${MARKET_ALLOWED_ORIGINS:?Set explicit HTTPS frontend origins}
    volumes:
      - ${MARKET_SOURCE_DB_PATH:?Set the source holdings database file}:/data/source/market.sqlite:ro
      - market_sidecar:/var/lib/tloomberg
    depends_on:
      market-initial-refresh:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - market-backend

  market-refresh-worker:
    image: ${MARKET_API_IMAGE:?Set an immutable market API image reference}
    command:
      - python
      - -m
      - site_api.refresh_worker
      - --db
      - /data/source/market.sqlite
      - --sidecar
      - /var/lib/tloomberg/site_data.sqlite
      - --refresh-minutes
      - ${MARKET_REFRESH_MINUTES:-10}
    environment:
      MARKET_PUBLIC_READ_ONLY: "true"
      MARKET_ALLOWED_ORIGINS: ${MARKET_ALLOWED_ORIGINS:?Set explicit HTTPS frontend origins}
    volumes:
      - ${MARKET_SOURCE_DB_PATH:?Set the source holdings database file}:/data/source/market.sqlite:ro
      - market_sidecar:/var/lib/tloomberg
    depends_on:
      market-initial-refresh:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - market-backend

  market-edge:
    image: caddy:2-alpine
    environment:
      MARKET_API_DOMAIN: ${MARKET_API_DOMAIN:?Set the market API domain}
    depends_on:
      market-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.market:/etc/caddy/Caddyfile:ro
      - market_caddy_data:/data
      - market_caddy_config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 100
    networks:
      - market-backend

volumes:
  market_sidecar:
  market_caddy_data:
  market_caddy_config:

networks:
  market-backend:
    driver: bridge
